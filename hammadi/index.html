<style>
:root{
  --bg:#f4f1ea;--card:#fff;--card2:#f1ede4;--line:#e7e2d6;--text:#1d2433;--mute:#6b7280;
  --navy:#1f3a5f;--navy2:#16304f;--gold:#b08a3e;--on-navy:#fff;
  --g:#15803d;--gbg:#dcfce7;--a:#b45309;--abg:#fef3c7;--r:#b91c1c;--rbg:#fee2e2;--b:#1d4ed8;--bbg:#dbeafe;--n:#475569;--nbg:#eef1f5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b;--card:#18202b;--card2:#1f2833;--line:#2a3442;--text:#e6e9ef;--mute:#98a2b3;
  --navy:#172a45;--navy2:#0f1f35;--gold:#d4a853;
  --g:#4ade80;--gbg:#14301f;--a:#fbbf24;--abg:#33270d;--r:#f87171;--rbg:#3a1717;--b:#93b4ff;--bbg:#18264a;--n:#cbd5e1;--nbg:#253041;
  --shadow:none;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;touch-action:manipulation}
button:active{transform:scale(.97)}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
button.ok{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
button.sm{padding:6px 11px;font-size:13px;border-radius:10px}
button.link{background:none;border:0;padding:0;color:var(--b);font-size:13px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 2px 4px}
.wrap{max-width:720px;margin:0 auto}
.top{background:var(--navy);color:var(--on-navy);padding:calc(14px + env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:5}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:19px;font-weight:700}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:10px;flex:none}
.login .logo{width:240px;max-width:80%;border-radius:18px;display:block;margin:0 auto}
.top small{opacity:.75;font-size:12.5px}
.av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;border:0;padding:0;flex:none}
.tabs{display:flex;margin-top:10px}
.tab{flex:1;text-align:center;padding:10px 2px;font-size:14px;font-weight:600;opacity:.65;border:0;border-bottom:3px solid transparent;background:none;color:inherit;border-radius:0}
.tab.on{opacity:1;border-color:var(--gold)}
.tab b{background:rgba(255,255,255,.18);border-radius:10px;padding:0 7px;font-size:12px;margin-inline-start:4px}
.seg{display:flex;margin:12px 16px 4px;background:var(--card2);border-radius:12px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute);padding:6px 18px 0}
.search{margin:8px 16px 0}
.search input{padding:8px 12px;font-size:14px}
.list{padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:start;width:100%}
.card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{font-size:15px;font-weight:600}
.meta{font-size:12.5px;color:var(--mute);margin-top:2px}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;display:inline-block}
.g{background:var(--gbg);color:var(--g)}.a{background:var(--abg);color:var(--a)}.r{background:var(--rbg);color:var(--r)}.b{background:var(--bbg);color:var(--b)}.n{background:var(--nbg);color:var(--n)}
.card.late{border-color:color-mix(in srgb,var(--r) 45%,var(--line))}
.card.soon{border-color:color-mix(in srgb,var(--a) 45%,var(--line))}
.card.done{opacity:.7}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-inline-start:auto}
.mini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.count{min-width:58px;text-align:center;border-radius:12px;padding:5px 4px;line-height:1.1;flex:none}
.count b{display:block;font-size:21px}.count span{font-size:11px}
.sec{font-size:12.5px;font-weight:700;color:var(--mute);padding:10px 4px 0;display:flex;align-items:center;gap:8px}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.person .ph{display:flex;align-items:center;gap:10px}
.person .ph .mini{width:34px;height:34px;font-size:15px}
.person .rows{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:9px;background:var(--card2);cursor:pointer;border:0;width:100%;text-align:start}
.empty{text-align:center;color:var(--mute);padding:34px 10px;font-size:14px}
.banner{margin:10px 16px 0;padding:12px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--abg);color:var(--a)}
.banner.bad{background:var(--rbg);color:var(--r)}
.banner.info{background:var(--bbg);color:var(--b)}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline-start:20px;background:var(--gold);border:0;color:#fff;border-radius:16px;padding:13px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .in{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
.grab{width:42px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 12px}
.sheet h2{font-size:17px}
.kv{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.kv div{display:flex;gap:10px;padding:8px 12px;font-size:13.5px;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv dt{color:var(--mute);min-width:96px;flex:none}
.kv dd{flex:1;word-break:break-word}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns button{flex:1;min-width:120px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.opt{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:start}
.opt.on{border:2px solid var(--navy);background:color-mix(in srgb,var(--navy) 8%,var(--card))}
.opt small{display:block;color:var(--mute);font-size:11.5px}
.log{margin-top:12px;font-size:12.5px;color:var(--mute);line-height:1.9}
.timeline{margin-top:12px}
.step{display:flex;gap:10px;padding:6px 0;font-size:13.5px;align-items:center;cursor:pointer}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.login{max-width:420px;margin:0 auto;padding:70px 24px;text-align:center}
.login h1{font-size:24px;margin:14px 0 6px}
.login p{color:var(--mute);font-size:14px;margin-bottom:22px}
.login .err{background:var(--rbg);color:var(--r);border-radius:12px;padding:10px;margin-top:16px;font-size:13px;text-align:start}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.toast.bad{background:#7f1d1d}
.more{display:block;margin:4px auto 0}
.mem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:13.5px}
.mem:first-child{border-top:0}
.mem span{flex:1;word-break:break-all}
</style>
</head>
<body>
<div id="app"><div class="login"><p>جاري التحميل…</p></div></div>
<script type="module">
// ?demo: الموقع كاملًا ببياناتٍ وهمية في الجهاز، بلا Firebase ولا شيت — للتجربة والفحص قبل النشر
const DEMO = new URLSearchParams(location.search).has('demo');

/* ───────── أدوات ───────── */
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = x => String(x).replace(/\d/g, d => AR[d]);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// تمييز العدد: يوم واحد، يومان، ٣–١٠ أيام، ١١+ يومًا
const days = k => k == 1 ? 'يوم' : k == 2 ? 'يومان' : k >= 3 && k <= 10 ? `${ar(k)} أيام` : `${ar(k)} يومًا`;
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const TODAY = () => iso(new Date());
const P = s => new Date(s + 'T12:00');
const diffD = (a, b) => Math.round((P(a) - P(b)) / 864e5);
const HF = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' });
const hParts = d => { const o = {}; for (const p of HF.formatToParts(d)) o[p.type] = +p.value; return [o.year, o.month, o.day]; };
// التاريخ الهجري كما يُكتب في الشيت: ١٤٤٨/٠٥/٢٣
const hijri = s => { if (!s) return ''; const [y, m, d] = hParts(P(s)); return ar(`${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`); };
// الشيت يكتب المواعيد بالهجري (أم القرى). نحوّلها لميلادي لنحسب الأيام الباقية:
// تقديرٌ أول من طول السنة الهجرية، ثم نبحث حوله يومًا يومًا حتى يطابق تقويم أم القرى نفسه
function fromHijri(y, m, d) {
  const est = new Date(Date.UTC(622, 6, 19) + ((y - 1) * 354.36707 + (m - 1) * 29.5306 + (d - 1)) * 864e5);
  for (let k = 0; k <= 12; k++) for (const s of k ? [k, -k] : [0]) {
    const t = new Date(est.getTime() + s * 864e5); t.setUTCHours(12);
    const [yy, mm, dd] = hParts(t);
    if (yy === y && mm === m && dd === d) return iso(new Date(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()));
  }
  return null;
}
// يلتقط تاريخًا من نصّ الخلية: «11:00:00 ص 1448/05/28» أو «1448/5/28» أو تاريخ ميلادي
// الشيت يعرض التاريخ بالهجري، لكن قيمته الحقيقية رقمٌ تسلسلي (أيام منذ ١٨٩٩/١٢/٣٠) لا يتأثر بالتقويم ولا بالتنسيق
const serial = n => { const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 864e5); return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); };
function pickDate(v) {
  if (typeof v === 'number' && v > 20000 && v < 80000) return serial(v);
  const s = String(v || '').replace(/[\u200e\u200f\u061c\u202a-\u202e\u2066-\u2069]/g, '').replace(/[٠-٩]/g, c => AR.indexOf(c));
  let m = s.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  // بعض الصفوف تكتب اليوم قبل الشهر (١٤٤٨/٣٠/٠٥): شهرٌ فوق ١٢ يعني أنهما مقلوبان
  if (m) { let y = +m[1], mo = +m[2], d = +m[3]; if (mo > 12 && d <= 12) [mo, d] = [d, mo]; return y > 1900 ? `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}` : fromHijri(y, mo, d); }
  m = s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
  if (m) { const y = +m[3]; return y > 1900 ? `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : fromHijri(y, +m[2], +m[1]); }
  return null;
}
// الأسماء تُكتب في الشيت بأكثر من رسم: «الأحيدب» و«الاحيدب». نطابق بعد توحيد الهمزات والتاء والياء
const norm = s => String(s || '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ً-ْـ\s.]/g, '');
const matchTeam = raw => { const r = norm(raw); if (!r) return null; return (S.cfg.team || []).find(t => r.includes(norm(t)) || norm(t).includes(r)) || null; };
const COLORS = ['#1f3a5f', '#0f766e', '#9a3412', '#7c3aed', '#be185d', '#0369a1'];
const color = name => { const i = (S.cfg.team || []).indexOf(name); return i >= 0 ? COLORS[i % COLORS.length] : '#64748b'; };
const mini = name => `<span class="mini" style="background:${color(name)}">${esc((name || '؟').replace(/^ال/, '')[0] || '؟')}</span>`;
const ek = e => String(e || '').toLowerCase().replace(/\./g, ',');
function toast(msg, bad) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 5000 : 2200);
}
const fail = e => { console.error(e); toast('ما انحفظ: ' + (e.code || e.message), true); };

/* ───────── الحالة ───────── */
const S = {
  user: null, cfg: {}, cfgReady: false, docs: {}, docsReady: false,
  sheet: { at: null, cases: [], appeals: [], archive: [], err: '', loading: false },
  tab: ['m', 'a', 'e'].includes(new URLSearchParams(location.search).get('tab')) ? new URLSearchParams(location.search).get('tab') : 'm',
  seg: 'mine', q: '', open: null, archN: 30,
  denied: false, asked: false, reqs: {},
};
const myEmail = () => String(S.user?.email || '').toLowerCase();
// صاحب الموقع وحده يضيف الأعضاء ويقبل الطلبات؛ والقواعد في Firebase تفرض هذا لا الواجهة وحدها
const isOwner = () => !!S.cfg.owner && S.cfg.owner === myEmail();
const me = () => S.user && (S.cfg.members || {})[ek(S.user.email)] || null;
const execWho = () => S.cfg.exec || '';
const KIND = { m: 'المذكرات', a: 'لوائح الاستئناف', e: 'التنفيذ' };
const STATUS = { new: ['جديدة', 'n'], wip: ['قيد العمل', 'b'], done: ['منجزة', 'g'] };

/* ───────── قراءة الشيت ───────── */
// الأعمدة بعناوينها لا بمواضعها، لأن الفريق يضيف أعمدة ويحرّكها (عمود «نوع المذكرة» أُضيف لاحقًا)
const HEAD = {
  caseNo: /رقم القضي/, lawyer: /^(المحامي|المسؤول)/, memo: /نوع المذكر/, req: /^المطلوب/,
  session: /(تاريخ|موعد) الجلس|تار+يخ انتها/, court: /^المحكمة/, circuit: /^الدائرة/,
  plaintiff: /اسم المدعي/, defendant: /المدعى عليه|اسم المدعى/, type: /نوع القضي/,
  last: /[اآ]خر (اجراء|إجراء)/, status: /^حالة/, remain: /^المتبقي/, deadline: /عداد المه/, note: /^ملاحظ/,
};
// تبويب «لوائح الاستئناف» منسوخٌ من تبويبات المحاكم وأغلب عناوينه «العمود ٢…»؛ فما لم يُسمَّ يؤخذ بموضعه هناك
const STD = { caseNo: 0, lawyer: 3, court: 4, circuit: 5, plaintiff: 6, defendant: 7, type: 10, session: 11, last: 15 };
function parseTab(title, rows, raw) {
  // العنوان قد يُكتب «عدّاد» بشدّة أو بتطويلٍ أو علامة اتجاه مخفية: نطابق بعد نزعها كلها
  const head = (rows[0] || []).map(h => String(h || '').replace(/[\u064B-\u0652\u0640\u200e\u200f\u061c\u202a-\u202e\u2066-\u2069]/g, '').replace(/[أإآ]/g, 'ا').replace(/\s+/g, ' ').trim());
  const col = {};
  for (const [k, re] of Object.entries(HEAD)) {
    let i = head.findIndex(h => re.test(h));
    if (k === 'plaintiff') i = head.findIndex(h => re.test(h) && !HEAD.defendant.test(h));
    if (i < 0 && STD[k] != null && /^(العمود|Column)/.test(head[STD[k]] || '')) i = STD[k];
    if (i >= 0) col[k] = i;
  }
  const out = [];
  rows.slice(1).forEach((r, n) => {
    const o = { tab: title, rowNo: n + 2 };
    for (const [k, i] of Object.entries(col)) o[k] = String(r[i] ?? '').trim();
    // القيمة الخام للتواريخ، إن وُجدت: أوثق من النص المعروض
    const rr = raw && raw[n + 1];
    if (rr) for (const k of ['deadline', 'session']) if (col[k] != null && typeof rr[col[k]] === 'number') o['_' + k] = rr[col[k]];
    if (o.caseNo) out.push(o);
  });
  return { col, rows: out, head };
}
const isAppeals = t => /استئناف/.test(t);
const isExec = t => /^\s*التنفيذ\s*$/.test(t);
function ingest(tabs) {
  const cases = [], appeals = [], archive = [];
  for (const [title, rows, raw] of tabs) {
    if (isExec(title)) {
      const head = (rows[0] || []).map(h => String(h || '').trim());
      const f = re => head.findIndex(h => re.test(h));
      const c = { date: 0, req: f(/رقم الطلب/), against: f(/المنفذ ضد/), amount: f(/مبلغ السند/), why: f(/سب+ب/), last: f(/آخر (إجراء|اجراء)/), status: f(/حالة الطلب/) };
      rows.slice(1).forEach(r => {
        const o = {}; for (const [k, i] of Object.entries(c)) o[k] = i >= 0 ? String(r[i] ?? '').trim() : '';
        if (o.req || o.against) archive.push(o);
      });
      continue;
    }
    const p = parseTab(title, rows, raw);
    if (p.col.caseNo == null) continue;
    (isAppeals(title) ? appeals : cases).push(...p.rows);
  }
  return { cases, appeals, archive };
}

/* ───────── المهام: الشيت + ما يُحفظ في الموقع ───────── */
// المحفوظ في Firebase الإسنادُ والحالة والسجلّ فقط، بمفتاح رقم القضية؛ وتفاصيل القضية تُقرأ من الشيت ساعة الفتح
// موعد المهلة: من قيمة الخلية الخام، ثم من نصّها، ثم من عمود «المتبقي» (عدد الأيام) إن لم يُفهم التاريخ
function dueOf(r) {
  if (r._due !== undefined) return r._due;
  const d = pickDate(r._deadline) || pickDate(r.deadline);

/* ───────── تنبيهات المهمة ─────────
   ثلاثة ثابتة لكل مهمة لا تُلغى: عند الإسناد، وقبل المهلة بيوم، وبعد فواتها بيوم.
   ويضاف عليها ما يختاره صاحبها: قبل المهلة بمدّة، أو في وقتٍ يحدّده. تُحفظ في المهمة وتصل لمن أُسندت إليه */
const localDT = ms => { const d = new Date(ms); return iso(d) + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const REM_OPTS = [[60, 'قبل ساعة'], [180, 'قبل ٣ ساعات'], [720, 'قبل ١٢ ساعة'], [2880, 'قبل يومين'], [4320, 'قبل ٣ أيام'], [10080, 'قبل أسبوع']];
const remLabel = r => r.at ? `${hijri(iso(new Date(r.at)))} · ${hm12(new Date(r.at).toTimeString().slice(0, 5))}` : (REM_OPTS.find(o => o[0] === r.mins) || [0, `قبل ${r.mins} دقيقة`])[1];
const baseAt = i => new Date(i.due + 'T' + (i.dueT || '09:00')).getTime();
function remHtml(it) {
  if (it.status === 'done') return '';
  const R = it.doc.rem || [];
  return `<label>التنبيهات</label>
  <div class="chips" style="margin-top:2px"><span class="chip n">📌 عند الإسناد</span>${it.due ? '<span class="chip n">⏰ قبل المهلة بيوم</span><span class="chip n">🔴 بعد فواتها بيوم</span>' : ''}
  ${R.map((r, n) => `<span class="chip b">🔔 ${esc(remLabel(r))} <button class="link" style="color:inherit;font-weight:700;margin-inline-start:4px" data-act="remdel" data-k="${esc(it.key)}" data-v="${n}" aria-label="حذف">✕</button></span>`).join('')}</div>
  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
    <select id="remk" style="flex:1;min-width:150px">${it.due ? REM_OPTS.map(([m, l]) => `<option value="${m}">${l}${it.dueT ? '' : ' (من ٩ ص)'}</option>`).join('') : ''}<option value="at">وقت أحدّده…</option></select>
    <input type="datetime-local" id="remat" value="${localDT(Date.now() + 15 * 6e4)}" min="${localDT(Date.now())}" style="flex:1;min-width:180px;${it.due ? 'display:none' : ''}">
    <button class="sm pri" data-act="remadd" data-k="${esc(it.key)}">+ تنبيه</button></div>`;
}

/* ───────── ملخّص الشيت المحفوظ ─────────
   إذن قراءة الشيت يعيش ساعة، والآيفون يطلب الضغط لتجديده. فمع كل تحميلٍ يُحفظ ملخّصٌ صغير
   لما تحتاجه المهام والتنبيهات: الرقم والنوع والمحامي والمهلة والمحكمة — بلا أسماء الخصوم ولا المبالغ.
   منه تظهر المهام وتُرسل التنبيهات وإن لم يُحمَّل الشيت، حتى يحمّله أحد */
const slim = r => ({ tab: r.tab, caseNo: r.caseNo, memo: r.memo || '', lawyer: r.lawyer || '', court: r.court || '', _due: dueOf(r), _dueT: dueTimeOf(r) });
function saveSheetCache() {
  const m = S.sheet.cases.filter(r => r.memo).map(slim), a = S.sheet.appeals.map(slim);
  const sig = JSON.stringify([m, a]);
  if (S.cfg.sheetCache && JSON.stringify([S.cfg.sheetCache.m, S.cfg.sheetCache.a]) === sig) return;
  S.cfg.sheetCache = { at: Date.now(), m, a };
  DB.saveCfg({ sheetCache: S.cfg.sheetCache });
}
function hydrate() {
  const c = S.cfg.sheetCache;
  if (S.sheet.at || !c) return;
  S.sheet.cases = c.m || []; S.sheet.appeals = c.a || []; S.sheet.cachedAt = c.at;
}

/* ───────── الكتابة ───────── */
function setAllowed(list) { S.cfg.allowed = list; DB.setAllowed(list); }
const stamp = (m) => ({ d: TODAY(), by: me() || '', m, t: Date.now() });
function base(it) { return { kind: it.kind, title: it.title, caseNo: it.caseNo || '' }; }
function put(k, patch, logMsg) {
  const it = items().find(i => i.key === k);
  const prev = S.docs[k] || {};
  const doc = { ...(it ? base(it) : {}), ...prev, ...patch, log: [...(prev.log || []), ...(logMsg ? [stamp(logMsg)] : [])] };
  S.docs[k] = doc; render();
  DB.saveTask(k, doc);
  syncPush();
}

/* ───────── الأحداث ───────── */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, k = t.dataset.k, v = t.dataset.v;
  if (a === 'close' && t !== e.target && t.classList.contains('sheet')) return;
  switch (a) {
    case 'login': return DB.login();
    case 'logout': S.open = null; document.querySelector('.sheet')?.remove(); return DB.logout();
    case 'tab': S.tab = v; S.archN = 30; return render();
    case 'seg': S.seg = v; return render();
    case 'sheet': return loadSheet(true);
    case 'more': S.archN += 50; return render();
    case 'open': S.open = { type: 'task', k }; return renderSheet();
    case 'new': S.open = { type: 'new' }; return renderSheet();
    case 'menu': S.open = { type: 'menu' }; return renderSheet();
    case 'close': S.open = null; document.querySelector('.sheet')?.remove(); return;
    case 'assign': {
      const it = items().find(i => i.key === k);
      if (it.who === v) return;
      put(k, { assignee: v }, it.who ? `أعاد إسنادها من ${it.who} إلى ${v}` : `أسندها إلى ${v}`);
      markSeen(k, v);
      if (v !== me()) pingNow(v, `📌 أُسندت لك مهمة: «${it.title}»${leftTxt(it) ? ' — ' + leftTxt(it) : ''}`, `${it.caseNo ? 'القضية ' + it.caseNo + ' · ' : ''}من ${me()}`, it.kind, k);
      toast(`أُسندت إلى ${v}`); return renderSheet();
    }
    case 'status': put(k, { status: v }, `غيّر الحالة إلى «${STATUS[v][0]}»`); return renderSheet();
    case 'done': {
      const dd = document.getElementById('doneDate').value || TODAY();
      const it = items().find(i => i.key === k);
      put(k, { status: 'done', doneDate: dd, doneBy: me() }, `${it.kind === 'e' ? 'نفّذها' : 'أنجزها'} بتاريخ ${hijri(dd)}`);
      toast('✓ تمّت'); S.open = null; document.querySelector('.sheet')?.remove(); return;
    }
    case 'reopen': put(k, { status: 'wip', doneDate: null, doneBy: null }, 'أعاد فتحها'); return renderSheet();
    case 'note': put(k, { note: document.getElementById('note').value.trim() }, 'عدّل الملاحظة'); toast('انحفظت'); return renderSheet();
    case 'del': if (!confirm('تحذف هذه المهمة؟')) return; put(k, { deleted: true }, 'حذفها'); S.open = null; document.querySelector('.sheet')?.remove(); return;
    case 'toexec': {
      const it = items().find(i => i.key === k);
      const ek2 = `e|${it.caseNo}`;
      const doc = { kind: 'e', title: 'تنفيذ حكم', caseNo: it.caseNo, from: k, assignee: execWho(), status: 'new', log: [stamp(`أسندها للتنفيذ إلى ${execWho()} (حكم لصالح الحمادي)`)] };
      S.docs[ek2] = doc; DB.saveTask(ek2, doc);
      markSeen(ek2, execWho());
      if (execWho() !== me()) pingNow(execWho(), '📌 أُسندت لك مهمة: «تنفيذ حكم»', `القضية ${it.caseNo} · حكم لصالح الحمادي · من ${me()}`, 'e', ek2);
      if (it.status !== 'done') put(k, { status: 'done', doneDate: TODAY(), doneBy: me() }, 'صدر الحكم لصالح الحمادي وأُحيلت للتنفيذ');
      toast(`أُسندت للتنفيذ إلى ${execWho()}`); S.open = { type: 'task', k: ek2 }; render(); return;
    }
    case 'create': {
      const title = document.getElementById('nt').value.trim();
      if (!title) return toast('اكتب عنوان المهمة', true);
      const key = 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      const who = document.getElementById('nw').value;
      const doc = { manual: true, kind: document.getElementById('nk').value, title, caseNo: document.getElementById('nc').value.trim(), due: document.getElementById('nd').value || null, dueT: document.getElementById('ndt').value || null, assignee: who, status: 'new', note: document.getElementById('nn').value.trim(), log: [stamp(who === me() ? 'أضافها لنفسه' : `أضافها وأسندها إلى ${who}`)] };
      S.docs[key] = doc; DB.saveTask(key, doc);
      markSeen(key, who);
      if (who !== me()) pingNow(who, `📌 أُسندت لك مهمة: «${title}»${doc.due ? ' — ' + leftTxt({ due: doc.due, left: diffD(doc.due, TODAY()) }) : ''}`, `${doc.caseNo ? 'القضية ' + doc.caseNo + ' · ' : ''}من ${me()}`, doc.kind, key); else syncPush();
      S.tab = doc.kind; S.open = null; document.querySelector('.sheet')?.remove(); toast('أُضيفت'); return render();
    }
    case 'savecfg': {
      const raw = document.getElementById('sid').value.trim();
      const id = (raw.match(/\/d\/([\w-]{20,})/) || [])[1] || raw;
      const team = document.getElementById('steam').value.split(/[،,\n]/).map(s => s.trim()).filter(Boolean);
      const ex = document.getElementById('sexec').value.trim();
      if (!id || !team.length) return toast('الرابط والأسماء مطلوبة', true);
      const changed = id !== S.cfg.sheetId;
      S.cfg = { ...S.cfg, sheetId: id, team, exec: team.includes(ex) ? ex : team[0] };
      const first = !S.cfg.owner ? { owner: myEmail(), allowed: [...new Set([...(S.cfg.allowed || []), myEmail()])] } : {};
      Object.assign(S.cfg, first);
      DB.saveCfg({ sheetId: S.cfg.sheetId, team: S.cfg.team, exec: S.cfg.exec, ...first });
      S.open = null; document.querySelector('.sheet')?.remove(); render(); toast('انحفظ');
      if (changed) loadSheet(false); return;
    }
    case 'allow': {
      const e2 = document.getElementById('newmail').value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e2)) return toast('اكتب إيميلًا صحيحًا', true);
      setAllowed([...new Set([...(S.cfg.allowed || []), e2])]); toast('أُضيف ' + e2); return renderSheet();
    }
    case 'accept': setAllowed([...new Set([...(S.cfg.allowed || []), v])]); DB.dropReq(v); delete S.reqs[v]; toast('قُبل ' + v); return renderSheet();
    case 'reject': DB.dropReq(v); delete S.reqs[v]; return renderSheet();
    case 'unallow': if (!confirm('تزيل ' + v + '؟')) return; setAllowed((S.cfg.allowed || []).filter(x => x !== v)); return renderSheet();
    case 'ask': await DB.ask({ email: myEmail(), name: S.user.displayName || '', t: Date.now() }); S.asked = true; return render();
    case 'remadd': {
      const it = items().find(i => i.key === k), sel = document.getElementById('remk').value;
      let r;
      if (sel === 'at') { const v2 = document.getElementById('remat').value; if (!v2) return toast('اختر التاريخ والساعة', true); r = { at: new Date(v2).getTime() }; if (r.at < Date.now() - 6e4) return toast('هذا الوقت فات — اختر وقتًا بعد الآن', true); if (r.at < Date.now() + 3e4) r.at = Date.now() + 3e4; }
      else r = { mins: +sel };
      if ((it.doc.rem || []).some(x => x.at === r.at && x.mins === r.mins)) return toast('موجود من قبل');
      put(k, { rem: [...(it.doc.rem || []), r] }, `أضاف تنبيهًا: ${remLabel(r)}`); toast('🔔 أُضيف التنبيه'); return renderSheet();
    }
    case 'remdel': { const it = items().find(i => i.key === k), R = (it.doc.rem || []).filter((_, n) => n !== +v); put(k, { rem: R }, 'حذف تنبيهًا'); return renderSheet(); }
    case 'recheck': return location.reload();
    case 'pushon': return enablePush();
    case 'pushoff': return disablePush();
    case 'setme': S.cfg.members = { ...(S.cfg.members || {}), [ek(S.user.email)]: v }; DB.saveCfg({ members: { [ek(S.user.email)]: v } }); render(); return loadSheet(false);
    case 'iam': { const m = { ...(S.cfg.members || {}) }; delete m[ek(S.user.email)]; S.cfg.members = m; DB.saveCfg({ members: { [ek(S.user.email)]: null } }); S.open = null; document.querySelector('.sheet')?.remove(); return render(); }
  }
});
document.addEventListener('change', e => { if (e.target.id === 'remk') { const a = document.getElementById('remat'); if (a) a.style.display = e.target.value === 'at' ? '' : 'none'; } });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'doneDate') { const h = document.getElementById('hd'); if (h) h.textContent = ' — ' + hijri(e.target.value || TODAY()); }
});

async function loadSheet(interactive) {
  if (!S.cfg.sheetId || S.sheet.loading) return;
  S.sheet.loading = true; S.sheet.err = ''; render();
  try {
    const tabs = await DB.readSheet(S.cfg.sheetId, interactive);
    if (!tabs) { S.sheet.loading = false; return render(); }
    Object.assign(S.sheet, ingest(tabs), { at: new Date(), err: '', cachedAt: null });
    saveSheetCache();
    if (S.open) renderSheet();
    syncPush();
  } catch (e) { console.error(e); S.sheet.err = e.message || String(e); }
  S.sheet.loading = false; render();
}

/* ───────── التخزين: Firebase، أو الجهاز في وضع التجربة ───────── */
let DB;
async function initDB() {
  if (DEMO) {
    const K = 'hammadi.demo';
    let D; try { D = JSON.parse(localStorage.getItem(K)) || {}; } catch (e) { D = {}; }
    D.tasks = D.tasks || {};
    D.cfg = D.cfg || { sheetId: 'demo', team: ['الأحيدب', 'الشلعان', 'القاسم', 'باوزير'], exec: 'القاسم', members: { [ek('demo@demo')]: 'القاسم' }, owner: 'demo@demo', allowed: ['demo@demo', 'shalaan.demo@gmail.com'] };
    D.reqs = D.reqs || { 'bawazir.demo@gmail.com': { email: 'bawazir.demo@gmail.com', name: 'باوزير (تجريبي)', t: 1 } };
    const save = () => { try { localStorage.setItem(K, JSON.stringify(D)); } catch (e) { } };
    DB = {
      onAuth: cb => cb({ uid: 'demo', email: 'demo@demo' }),
      login() { }, logout() { localStorage.removeItem(K); location.reload(); },
      listen(h) { setTimeout(() => { h.cfg(JSON.parse(JSON.stringify(D.cfg))); h.tasks({ ...D.tasks }); h.reqs({ ...D.reqs }); }, 30); },
      setAllowed: list => { D.cfg.allowed = list; save(); },
      dropReq: e => { delete D.reqs[e]; save(); },
      ask: () => { },
      // دمجٌ كدمج Firebase (merge): الخرائط تُضاف إليها لا تُستبدل، وnull يحذف المفتاح
      saveCfg: p => { for (const [k, v] of Object.entries(p)) { if (v && typeof v === 'object' && !Array.isArray(v)) { D.cfg[k] = { ...(D.cfg[k] || {}), ...v }; for (const [a, b] of Object.entries(v)) if (b == null) delete D.cfg[k][a]; } else D.cfg[k] = v; } save(); },

    myEndpoint = j.endpoint; localStorage.setItem('hammadi.ep', myEndpoint);
    S.cfg.subs = { ...(S.cfg.subs || {}), [me()]: { ...(S.cfg.subs?.[me()] || {}), [hash(j.endpoint)]: j } };
    await DB.saveCfg({ subs: { [me()]: { [hash(j.endpoint)]: j } } });
    const t = await api('test', { sub: j });
    toast(t.ok ? '✓ تفعّلت، وجاك إشعار تجربة' : 'تفعّلت، بس التجربة ما وصلت: ' + t.error, !t.ok);
    syncAll();
  } catch (e) { console.error(e); toast('ما زبط التفعيل: ' + e.message, true); }
  renderSheet();
}
async function disablePush() {
  try { const r = swReg || await navigator.serviceWorker.ready; const sub = await r.pushManager.getSubscription(); if (sub) { await api('off', { endpoint: sub.endpoint }); await sub.unsubscribe(); } } catch (e) { console.error(e); }
  if (myEndpoint) { const m = { ...(S.cfg.subs?.[me()] || {}) }; delete m[hash(myEndpoint)]; S.cfg.subs = { ...S.cfg.subs, [me()]: m }; DB.saveCfg({ subs: { [me()]: { [hash(myEndpoint)]: null } } }); }
  myEndpoint = ''; localStorage.removeItem('hammadi.ep');
  toast('وقفت الإشعارات'); renderSheet();
}

/* ───────── البدء ───────── */
await initDB();
DB.onAuth(u => {
  S.user = u; S.cfgReady = false; S.docs = {}; S.denied = false; S.reqs = {};
  if (!u) return render();
  render();
  let first = true;
  DB.listen({
    cfg: c => { S.cfg = c || {}; S.cfgReady = true; const was = !!S.sheet.cachedAt; hydrate(); render(); if (first && me()) { first = false; loadSheet(false); } if (!was && S.sheet.cachedAt) syncPush(); },
    tasks: o => { S.docs = o; S.docsReady = true; render(); },
    reqs: o => { const n = Object.keys(o).length, was = Object.keys(S.reqs).length; S.reqs = o; if (n > was) toast(`طلب دخول جديد — من الإعدادات`); if (S.open?.type === 'menu') renderSheet(); render(); },
    denied: () => { S.denied = true; render(); },
  });
});
</script>
