<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مشروع الحمادي</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحمادي">
<meta name="robots" content="noindex">
<!-- شعار المكتب، لا أيقونة «النادي» التي في جذر المستودع -->
<link rel="icon" type="image/png" href="wael-icon.png?v=3">
<link rel="apple-touch-icon" href="wael-icon-512.png?v=3">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ألوان هادية: كحلي باهت ورمادي دافئ، والحالات بدرجاتٍ ناعمة لا فاقعة */
  --bg:#f6f5f2;--card:#fff;--card2:#efede8;--line:#e9e6df;--text:#2a3342;--mute:#7b8190;
  --navy:#34495e;--navy2:#2c3e50;--gold:#b9a37c;--on-navy:#fff;
  --g:#4f7a5c;--gbg:#e9f1ea;--a:#93733a;--abg:#f5efe2;--r:#a5524b;--rbg:#f6eae8;--b:#4a6787;--bbg:#e9eef4;--n:#5f6672;--nbg:#eef0f3;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 3px 10px rgba(0,0,0,.035);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181d;--card:#1d2128;--card2:#252a32;--line:#2e343d;--text:#e4e6ea;--mute:#9aa1ac;
  --navy:#8fa7c0;--navy2:#2c3e50;--gold:#b9a37c;
  --g:#8fbf9c;--gbg:#1f2b23;--a:#d1b27a;--abg:#2d271b;--r:#d99891;--rbg:#2f2120;--b:#9fb6d1;--bbg:#1f2733;--n:#b8bec8;--nbg:#262b33;
  --shadow:none;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;touch-action:manipulation}
button:active{transform:scale(.97)}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
button.ok{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
button.sm{padding:6px 11px;font-size:13px;border-radius:10px}
button.link{background:none;border:0;padding:0;color:var(--b);font-size:13px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 2px 4px}
.wrap{max-width:720px;margin:0 auto}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.bar1{display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.bar1 img{width:32px;height:32px;border-radius:9px;flex:none}
.bar1 b{font-size:16px;color:var(--navy);font-weight:600}
.bar1 small{display:block;font-size:11.5px;color:var(--mute);font-weight:400}
.brand{display:flex;align-items:center;gap:10px}
.login .logo{width:240px;max-width:80%;border-radius:18px;display:block;margin:0 auto}
.av{margin-inline-start:auto;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:600;border:0;padding:0;flex:none}
.bar2{display:flex;align-items:center;gap:8px;padding:0 14px 10px;position:relative}
.dd{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;color:var(--navy);padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.dd.open{background:var(--bbg);border-color:color-mix(in srgb,var(--b) 25%,var(--line))}
.dd .cv{font-size:11px;color:var(--mute)}
.bar2 .st{margin-inline-start:auto;font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:12px}
.menu{position:absolute;top:calc(100% - 4px);right:14px;width:min(290px,calc(100vw - 28px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:6px;z-index:8}
.menu .grp{font-size:11.5px;color:var(--mute);font-weight:600;padding:8px 10px 4px}
.menu .sep{height:1px;background:var(--line);margin:6px 8px}
.mi{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--text);width:100%;border:0;background:none;text-align:start}
.mi:active,.mi:hover{background:var(--card2)}
.mi.on{background:var(--bbg);color:var(--b)}
.mi .sq{width:9px;height:9px;border-radius:3px;flex:none}
.mi .c{margin-inline-start:auto;font-size:12px;border-radius:10px;padding:1px 9px;background:var(--nbg);color:var(--n);font-weight:600}
.mi .c.l{background:var(--rbg);color:var(--r)}
.veil{position:fixed;inset:0;z-index:4;background:rgba(20,25,35,.08)}
.h1{padding:16px 16px 0;font-size:22px;font-weight:700;color:var(--navy)}
.sub{padding:0 16px;font-size:12.5px;color:var(--mute)}
.sub b{color:var(--r);font-weight:600}
.seg{display:flex;gap:6px;padding:12px 14px 2px;overflow-x:auto}
.seg button{padding:7px 13px;border-radius:11px;font-weight:600;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* المتأخر أولًا */
.lateBox{margin:14px 14px 0;background:var(--card);border:1px solid color-mix(in srgb,var(--r) 18%,var(--line));border-radius:16px;overflow:hidden}
.lateHd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--rbg);color:var(--r);font-weight:600;font-size:14px}
.lateHd .n{margin-inline-start:auto;font-size:12px;background:var(--card);border-radius:10px;padding:1px 9px}
.row1{display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:start;border-radius:0}
.row1:first-child{border-top:0}
.row1:active{background:var(--card2);transform:none}
.row1 .t{flex:1;min-width:0}
.row1 b{font-size:14.5px;font-weight:600;display:block}
.row1 small{display:block;font-size:12px;color:var(--mute)}
.row1 .r2{text-align:left;font-size:12.5px;font-weight:600;white-space:nowrap}
.row1 .r2 .k{display:block;color:var(--mute);font-size:11px;font-weight:500;margin-top:1px}
.tag{font-size:11px;color:var(--mute);background:var(--nbg);border-radius:8px;padding:2px 8px;font-weight:600;white-space:nowrap}
.box{margin:12px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bh{font-size:12.5px;color:var(--mute);font-weight:600;margin:14px 18px 6px;display:flex;align-items:center;gap:6px}
.bh .c{background:var(--nbg);border-radius:10px;padding:0 8px;font-size:11.5px}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* تقويم المكتب */
.cal{margin:12px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.calh{display:flex;align-items:center;gap:8px;padding:11px 14px 6px;flex-wrap:wrap}
.calh b{font-size:15px;color:var(--navy)}
.calh small{font-size:12px;color:var(--mute)}
.tg{margin-inline-start:auto;display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.tg button{padding:4px 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mute);border:0;background:none}
.tg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.calnav{display:flex;align-items:center;gap:6px;padding:0 14px 6px;font-size:13px;font-weight:600;color:var(--navy)}
.calnav button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);padding:0;color:var(--mute)}
.calnav span{flex:1;text-align:center}
.fl{display:flex;gap:6px;padding:2px 14px 8px;overflow-x:auto}
.fc{padding:4px 11px;border-radius:20px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:5px;white-space:nowrap;background:var(--card)}
.fc.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 10px 8px}
.cg .w{font-size:10.5px;color:var(--mute);text-align:center;padding-bottom:2px}
.cd{border:0;background:none;border-radius:10px;padding:5px 0 6px;text-align:center;min-height:44px;color:var(--text)}
.cd small{display:block;font-size:10.5px;color:var(--mute)}
.cd b{display:inline-block;font-size:14px;font-weight:600;min-width:22px}
.cd.td b{background:var(--navy);color:#fff;border-radius:7px}
.cd.sel{background:var(--bbg);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--b) 30%,transparent)}
.cd.out{opacity:.35}
.ds{display:flex;gap:3px;justify-content:center;margin-top:4px;min-height:6px;flex-wrap:wrap;padding:0 2px}
.ds i{width:6px;height:6px;border-radius:50%;display:block}
.ds i.q{border-radius:2px}
.agenda{border-top:1px solid var(--line)}
.agenda h4{font-size:12.5px;color:var(--mute);font-weight:600;padding:9px 14px 2px}
.agenda .row1 .tm{width:58px;color:var(--mute);font-size:12px;flex:none}
.agenda .who2{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:5px;white-space:nowrap}
.phonebtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-top:1px solid var(--line);border-radius:0;padding:11px;font-size:13px;font-weight:600;color:var(--b);background:color-mix(in srgb,var(--card2) 50%,var(--card))}
/* مهام الفريق */
.pp{margin:12px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;width:100%;border:0;background:none;text-align:start;border-radius:0}
.ph .mini{width:34px;height:34px;font-size:14px}
.ph b{font-size:15px;font-weight:600}.ph small{display:block;font-size:12px;color:var(--mute)}
.ph .cv{color:var(--mute);font-size:12px;margin-inline-start:4px}
.dist{height:5px;margin:0 14px 12px;border-radius:4px;background:var(--nbg);display:flex;overflow:hidden}
.dist i{display:block;height:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute);padding:6px 18px 0}
.search{margin:8px 16px 0}
.search input{padding:8px 12px;font-size:14px}
.list{padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:14px;padding:11px 14px;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:start;width:100%;transition:transform .12s,box-shadow .15s,background .15s}
/* لحظة الضغط: تصغر قليلًا وينحدّد إطارها، فيُعرف أنها انضغطت */
.card:active,.card.press{transform:scale(.985);box-shadow:0 0 0 2px color-mix(in srgb,var(--b) 28%,transparent);background:color-mix(in srgb,var(--bbg) 35%,var(--card))}
.card .hd{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.card .hd .when{margin-inline-start:auto;color:var(--mute);font-weight:500;font-size:11.5px}
.card .foot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.card.done{opacity:.6}
@keyframes flash{0%{background:var(--gbg)}100%{background:var(--card)}}
.card.flash{animation:flash 1.4s ease}
.card h3{font-size:15.5px;font-weight:600;margin-top:4px}
.meta{font-size:12.5px;color:var(--mute);margin-top:2px}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;display:inline-block}
.g{background:var(--gbg);color:var(--g)}.a{background:var(--abg);color:var(--a)}.r{background:var(--rbg);color:var(--r)}.b{background:var(--bbg);color:var(--b)}.n{background:var(--nbg);color:var(--n)}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-inline-start:auto}
.mini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.count{min-width:58px;text-align:center;border-radius:12px;padding:5px 4px;line-height:1.1;flex:none}
.count b{display:block;font-size:21px}.count span{font-size:11px}
.sec{font-size:12.5px;font-weight:700;color:var(--mute);padding:10px 4px 0;display:flex;align-items:center;gap:8px}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.person .ph{display:flex;align-items:center;gap:10px}
.person .ph .mini{width:34px;height:34px;font-size:15px}
.person .rows{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:9px;background:var(--card2);cursor:pointer;border:0;width:100%;text-align:start}
.empty{text-align:center;color:var(--mute);padding:34px 10px;font-size:14px}
.banner{margin:10px 16px 0;padding:12px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--abg);color:var(--a)}
.banner.bad{background:var(--rbg);color:var(--r)}
.banner.info{background:var(--bbg);color:var(--b)}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));inset-inline-start:20px;background:var(--navy);border:0;color:#fff;border-radius:14px;padding:12px 16px;font-weight:600;box-shadow:0 4px 12px rgba(52,73,94,.3);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .in{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
.grab{width:42px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 12px}
.xbtn{position:sticky;top:0;float:left;margin:-6px -4px 0 0;width:38px;height:38px;border-radius:50%;padding:0;font-size:18px;line-height:1;display:grid;place-items:center;background:var(--card);z-index:2}
.sheet h2{font-size:17px}
.kv{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.kv div{display:flex;gap:10px;padding:8px 12px;font-size:13.5px;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv dt{color:var(--mute);min-width:96px;flex:none}
.kv dd{flex:1;word-break:break-word}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns button{flex:1;min-width:120px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.opt{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:start}
.opt.on{border:2px solid var(--navy);background:color-mix(in srgb,var(--navy) 8%,var(--card))}
.opt small{display:block;color:var(--mute);font-size:11.5px}
.log{margin-top:12px;font-size:12.5px;color:var(--mute);line-height:1.9}
.timeline{margin-top:12px}
.step{display:flex;gap:10px;padding:6px 0;font-size:13.5px;align-items:center;cursor:pointer}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.login{max-width:420px;margin:0 auto;padding:70px 24px;text-align:center}
.login h1{font-size:24px;margin:14px 0 6px}
.login p{color:var(--mute);font-size:14px;margin-bottom:22px}
.login .err{background:var(--rbg);color:var(--r);border-radius:12px;padding:10px;margin-top:16px;font-size:13px;text-align:start}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#3a4556;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.toast.bad{background:#8a4a44}
.toast.ok{background:#4a6b55}
.more{display:block;margin:4px auto 0}
.drive{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;padding:11px;border-radius:12px;background:var(--bbg);color:var(--b);font-weight:700;text-decoration:none;border:1px solid color-mix(in srgb,var(--b) 25%,transparent)}
.mem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:13.5px}
.mem:first-child{border-top:0}
.mem span{flex:1;word-break:break-all}
</style>
</head>
<body>
<div id="app"><div class="login"><p>جاري التحميل…</p></div></div>
<script type="module">
// ?demo: الموقع كاملًا ببياناتٍ وهمية في الجهاز، بلا Firebase ولا شيت — للتجربة والفحص قبل النشر
const DEMO = new URLSearchParams(location.search).has('demo');

/* ───────── أدوات ───────── */
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = x => String(x).replace(/\d/g, d => AR[d]);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// تمييز العدد: يوم واحد، يومان، ٣–١٠ أيام، ١١+ يومًا
const days = k => k == 1 ? 'يوم' : k == 2 ? 'يومان' : k >= 3 && k <= 10 ? `${ar(k)} أيام` : `${ar(k)} يومًا`;
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const TODAY = () => iso(new Date());
const P = s => new Date(s + 'T12:00');
const diffD = (a, b) => Math.round((P(a) - P(b)) / 864e5);
const HF = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' });
const hParts = d => { const o = {}; for (const p of HF.formatToParts(d)) o[p.type] = +p.value; return [o.year, o.month, o.day]; };
// التاريخ الهجري كما يُكتب في الشيت: ١٤٤٨/٠٥/٢٣
const hijri = s => { if (!s) return ''; const [y, m, d] = hParts(P(s)); return ar(`${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`); };
// الشيت يكتب المواعيد بالهجري (أم القرى). نحوّلها لميلادي لنحسب الأيام الباقية:
// تقديرٌ أول من طول السنة الهجرية، ثم نبحث حوله يومًا يومًا حتى يطابق تقويم أم القرى نفسه
function fromHijri(y, m, d) {
  const est = new Date(Date.UTC(622, 6, 19) + ((y - 1) * 354.36707 + (m - 1) * 29.5306 + (d - 1)) * 864e5);
  for (let k = 0; k <= 12; k++) for (const s of k ? [k, -k] : [0]) {
    const t = new Date(est.getTime() + s * 864e5); t.setUTCHours(12);
    const [yy, mm, dd] = hParts(t);
    if (yy === y && mm === m && dd === d) return iso(new Date(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()));
  }
  return null;
}

const localDT = ms => { const d = new Date(ms); return iso(d) + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const REM_OPTS = [[60, 'قبل ساعة'], [180, 'قبل ٣ ساعات'], [720, 'قبل ١٢ ساعة'], [2880, 'قبل يومين'], [4320, 'قبل ٣ أيام'], [10080, 'قبل أسبوع']];

const baseAt = i => new Date(i.due + 'T' + (i.dueT || '09:00')).getTime();

/* ───────── ملخّص الشيت المحفوظ ─────────
   إذن قراءة الشيت يعيش ساعة، والآيفون يطلب الضغط لتجديده. فمع كل تحميلٍ يُحفظ ملخّصٌ صغير
   لما تحتاجه المهام والتنبيهات: الرقم والنوع والمحامي والمهلة والمحكمة — بلا أسماء الخصوم ولا المبالغ.
   منه تظهر المهام وتُرسل التنبيهات وإن لم يُحمَّل الشيت، حتى يحمّله أحد */
const slim = r => ({ tab: r.tab, caseNo: r.caseNo, memo: r.memo || '', lawyer: r.lawyer || '', court: r.court || '', ...(r.status ? { status: r.status } : {}), ...(r.link ? { link: r.link } : {}), ...(opp(r) ? { opp: opp(r) } : {}), _due: dueOf(r), _dueT: dueTimeOf(r), _src: dueSrc(r) });
/* الجلسات القادمة لكل قضية فيها محامٍ، من عمود «تاريخ/موعد الجلسة» في تبويبات المحاكم.
   القضية تتكرّر بين «العام» وتبويب محكمتها، فتُجمع بالرقم والتاريخ، ويُفضَّل الصف الذي فيه الساعة */
function sessionsFrom(rows) {
  const m = new Map(), today = TODAY();
  for (const r of rows) {
    const d = pickDate(r._session) || pickDate(r.session);
    if (!d || d < today || !r.lawyer) continue;
    const t = timeFrom(r._session, r.session), k = r.caseNo + '|' + d, o = m.get(k);
    if (!o || (!o.t && t)) m.set(k, { caseNo: r.caseNo, lawyer: r.lawyer, court: r.court || '', circuit: r.circuit || '', opp: opp(r), d, t });
  }
  return [...m.values()].sort((a, b) => (a.d + (a.t || '')).localeCompare(b.d + (b.t || '')));
}
function saveSheetCache() {
  const m = S.sheet.cases.filter(r => r.memo).map(slim), a = S.sheet.appeals.map(slim), ss = S.sheet.sessions || [];
  const sig = JSON.stringify([m, a, ss]);
  if (S.cfg.sheetCache && JSON.stringify([S.cfg.sheetCache.m, S.cfg.sheetCache.a, S.cfg.sheetCache.s || []]) === sig) return;
  S.cfg.sheetCache = { at: Date.now(), m, a, s: ss };
  DB.saveCfg({ sheetCache: S.cfg.sheetCache });
}
function hydrate() {
  const c = S.cfg.sheetCache;
  if (S.sheet.at || !c) return;
  S.sheet.cases = c.m || []; S.sheet.appeals = c.a || []; S.sheet.sessions = c.s || []; S.sheet.cachedAt = c.at;
}

/* ───────── التنبيه اللحظي من الشيت ─────────
   الموقع لا يرى تعديل الشيت حتى يقرأه. فسكربتٌ داخل الشيت نفسه يلتقط كل تعديل لحظته
   (المحامي، نوع المذكرة، المهلة، وما تُحسب منه المهلة بمعادلة) ويرسله لخادم الإشعارات،
   فيصل صاحبه على كل أجهزته وإن لم يفتح أحدٌ الموقع. والسرّ يُولَّد هنا ولا يمرّ بالمستودع */
function hookScript(secret) {
  return `// تنبيهات «مشروع الحمادي» لحظة تعديل الشيت — يولّدها الموقع، لا تعدّل فيها
const HOOK = '${PUSH}hook';
const SECRET = '${secret}';
const ME = '${me()}';
const EXEC = '${execWho()}';  // «تنفيذ» في نوع المذكرة يذهب له، أيًّا كان المحامي
const SKIP = /^(التنفيذ|رسوم بيانية|بيانات_الحسابات|تقويم_أم_القرى|التقرير المالي القادم)$/;

// شغّلها مرة واحدة من القائمة فوق: تربط التنبيه بالشيت وتحفظ الحالة الحالية وترسل لك تجربة
function setup() {
  ScriptApp.getProjectTriggers().filter(t => t.getHandlerFunction() === 'onSheetEdit').forEach(t => ScriptApp.deleteTrigger(t));
  ScriptApp.newTrigger('onSheetEdit').forSpreadsheet(SpreadsheetApp.getActive()).onEdit().create();
  const P = PropertiesService.getDocumentProperties();
  SpreadsheetApp.getActive().getSheets().forEach(sh => { if (!SKIP.test(sh.getName())) scan(sh, 2, sh.getLastRow(), P, true); });
  send(ME, '✓ سكربت الشيت مربوط', 'أي تعديل في المحامي أو المهلة يوصل صاحبه على طول', 'm');
}

function onSheetEdit(e) {
  const sh = e.range.getSheet();
  if (SKIP.test(sh.getName())) return;
  scan(sh, Math.max(2, e.range.getRow()), e.range.getLastRow(), PropertiesService.getDocumentProperties(), false);
}

const clean = h => String(h || '').replace(/[\\u064B-\\u0652\\u0640\\u200e\\u200f]/g, '').replace(/[أإآ]/g, 'ا').replace(/\\s+/g, ' ').trim();
function cols(head) {
  const f = re => head.findIndex(h => re.test(h));
  const std = (i, k) => i >= 0 ? i : (/^(العمود|Column)/.test(head[k] || '') ? k : -1);
  const def = f(/المدعى عليه/);
  return { status: f(/^حالة/), caseNo: f(/رقم القضي/), lawyer: std(f(/^(المحامي|المسؤول)/), 3), memo: f(/نوع المذكر/), deadline: f(/عداد المه/), pl: std(head.findIndex(h => /اسم المدعي/.test(h) && !/عليه/.test(h)), 6), df: std(def, 7) };
}

function scan(sh, r0, r1, P, silent) {
  if (r1 < r0) return;
  const tab = sh.getName(), appeal = /استئناف/.test(tab);
  const head = sh.getRange(1, 1, 1, sh.getLastColumn()).getDisplayValues()[0].map(clean);
  const c = cols(head);
  if (c.caseNo < 0 || (!appeal && c.memo < 0)) return;
  const rows = sh.getRange(r0, 1, r1 - r0 + 1, head.length).getDisplayValues();
  for (const row of rows) {
    const caseNo = String(row[c.caseNo] || '').trim(), memo = appeal ? 'لائحة اعتراض' : String(row[c.memo] || '').trim();
    // لائحةٌ على حكمٍ ليس ضد الحمادي لا تُكتب، فلا تُبلَّغ
    if (appeal && !/ضد/.test(c.status >= 0 ? String(row[c.status] || '') : '')) continue;
    if (!caseNo || !memo) continue;
    const exec = !appeal && /تنفيذ/.test(memo);
    const lawyer = exec ? EXEC : c.lawyer >= 0 ? String(row[c.lawyer] || '').trim() : '';
    const dl = c.deadline >= 0 ? String(row[c.deadline] || '').trim() : '';
    const key = (appeal ? 'a|' : 'm|') + caseNo + '|' + memo, prev = JSON.parse(P.getProperty(key) || 'null');
    P.setProperty(key, JSON.stringify({ l: lawyer, d: dl }));
    if (silent) continue;
    const pa = c.pl >= 0 ? String(row[c.pl] || '').trim() : '', pb = c.df >= 0 ? String(row[c.df] || '').trim() : '';
    const op = /حماد/.test(pa) ? pb : /حماد/.test(pb) ? pa : pb || pa;

/* ───────── تقويم الجوال ─────────
   ملف تقويم (ics) بجلساتي ومهلي القادمة يضيفه الآيفون لتقويمه. لكل موعدٍ معرّفٌ ثابت (UID)،

function calEvents() {

  for (const g of S.sheet.sessions || []) if (matchTeam(g.lawyer) === who)
    ev.push({ uid: `ses-${g.caseNo}-${g.d}`, d: g.d, t: g.t, mins: 60, title: `⚖️ جلسة — القضية ${g.caseNo}${g.opp ? ' · ' + g.opp : ''}`, desc: [g.court, g.circuit && 'الدائرة ' + g.circuit].filter(Boolean).join(' · '), url: base + '?open=' + encodeURIComponent(`ses:${g.caseNo}:${g.d}`) });

    ev.push({ uid: `due-${hash(i.key)}`, d: i.due, t: null, title: `⏰ آخر يوم: ${i.title} — القضية ${i.caseNo}${opp(i.row) ? ' · ' + opp(i.row) : ''}`, desc: KIND[i.kind] + (i.dueT ? ' · المهلة ' + hm12(i.dueT) : ''), url: base + '?open=' + encodeURIComponent(`d1:${i.key}:${i.due}`) });

function buildIcs(ev) {
  const z = n => String(n).padStart(2, '0');

      ['1447/8/13', '40100000002', '', 'شركة الحمادي', 'منفذ ضده ٢ (تجريبي)', '213,712', '', 'حكم', '', 'رفض السند', '', 'لم ينفذ', ''],
    ]],
  ];
}

/* ───────── الإشعارات والجوال مقفل ─────────
   خادم «يومي» نفسه: يحفظ لكل جهاز قائمة مواعيد، ويصحى كل دقيقة ويرسل ما حان، وكل إرسالٍ جديد
   يستبدل قائمة ذلك الجهاز. فأي جهازٍ في الفريق يقدر يحسب مواعيد أي عضو — البيانات مشتركة —
   ويرسلها لاشتراكاته المحفوظة في الإعداد. هكذا يصل إشعار الإسناد لمن أُسندت إليه وإن لم يفتح الموقع. */
const PUSH = 'https://dynamic-churros-f6908c.netlify.app/yawmi/';
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const standalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const pushOK = () => !DEMO && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let swReg = null;
if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => { });
navigator.serviceWorker?.addEventListener('message', e => { if (e.data && e.data.tab) { S.tab = e.data.tab; if (e.data.open) S.pendingOpen = e.data.open; render(); } });
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4), r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
// بمهلة ٢٠ ثانية: طلبٌ معلّق على شبكة الجوال كان يوقف الإرسال كله بلا كلمة
const api = (path, body) => { const c = new AbortController(), t = setTimeout(() => c.abort(), 20000); return fetch(PUSH + path, { signal: c.signal, ...(body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}) }).then(r => r.json()).finally(() => clearTimeout(t)); };
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return 'd' + (h >>> 0).toString(36); };
let myEndpoint = '';
try { myEndpoint = localStorage.getItem('hammadi.ep') || ''; } catch (e) { }
const pushOn = () => !!myEndpoint && !!(S.cfg.subs?.[me()] || {})[hash(myEndpoint)];
// «باقي ٧ أيام» لمهمةٍ لها مهلة، تُلحق بإشعار الإسناد
const leftTxt = it => it && it.due ? (it.left < 0 ? `متأخرة ${days(-it.left)}` : it.left === 0 ? 'آخر يوم اليوم' : `باقي ${days(it.left)}`) : '';
const at = (d, hm) => new Date(d + 'T' + hm).getTime();
const addDays = (d, k) => { const t = P(d); t.setDate(t.getDate() + k); return iso(t); };
// مواعيد عضوٍ واحد للأيام التسعة الجاية، من مهامه المفتوحة
function schedule(name) {
  const out = [], now = Date.now(), add = (ms, k, title, body, tab) => { if (ms > now) out.push({ at: ms, k, title, body, tab }); };
  const mine = items().filter(i => i.who === name && i.status !== 'done');
  // تحت العنوان: رقم القضية واسم الخصم وحدهما، فيُعرف من شاشة القفل أيّ قضية
  const where = i => [i.caseNo && 'القضية ' + i.caseNo, opp(i.row)].filter(Boolean).join(' · ');
  // ثلاثة تنبيهات للمهمة لا أكثر: عند الإسناد (من pingNow)، وقبل المهلة بيوم، وصباح اليوم التالي لفواتها.
  // لا ملخّصات يومية: كل تنبيهٍ يقول أيّ مهمةٍ بعينها
  for (const i of mine) if (i.due) {
    add(at(addDays(i.due, -1), '09:00'), `d1:${i.key}:${i.due}`, `⏰ تنتهي مهلة «${i.title}» — باقي يوم`, where(i), i.kind);
    for (const r of remsOf(i.doc)) if (r.mins) add(baseAt(i) - r.mins * 6e4, `r:${i.key}:${i.due}:${r.mins}`, `⏰ «${i.title}» — ${r.mins < 1440 ? 'باقي ' + (r.mins === 60 ? 'ساعة' : r.mins === 180 ? '٣ ساعات' : ar(r.mins / 60) + ' ساعة') : 'باقي ' + days(r.mins / 1440)}`, where(i) + (i.dueT ? ' · المهلة ' + hm12(i.dueT) : ''), i.kind);
    add(at(addDays(i.due, 1), '09:00'), `late:${i.key}:${i.due}`, `🔴 عندك «${i.title}» المفروض ${i.kind === 'e' ? 'تنفّذها' : 'تكتبها'} أمس`, where(i), i.kind);
  }
  // ما حدّده صاحب المهمة بوقته، وإن لم يكن لها مهلة
  for (const i of mine) for (const r of remsOf(i.doc)) if (r.at) add(r.at, `t:${i.key}:${r.at}`, `🔔 تذكير: «${i.title}»`, where(i) + (i.due ? ' · ' + leftTxt({ due: i.due, left: diffD(i.due, iso(new Date(r.at))) }) : ''), i.kind);
  // قبل كل جلسةٍ بساعة، لمن اسمه في «المحامي» لقضيتها. وجلسةٌ بلا ساعة: الثامنة صباح يومها
  for (const g of S.sheet.sessions || []) if (matchTeam(g.lawyer) === name) {
    // العنوان قصير والوقت فيه (الطويل يُقصّ في شاشة القفل)، وتحته رقم القضية واسم الخصم فقط
    const who = ['القضية ' + g.caseNo, g.opp].filter(Boolean).join(' · ');
    const at0 = new Date(g.d + 'T' + (g.t || '09:00')).getTime();
    // وقبلها باثنتي عشرة ساعة أيضًا (من ٩ ص إن لم تُكتب ساعتها): تذكيرٌ من الليلة قبلها
    add(at0 - 12 * 3600e3, `ses12:${g.caseNo}:${g.d}`, `⚖️ جلسة بعد ١٢ ساعة — ${g.t ? hm12(g.t) : 'بكرة'}`, who, 'm');
    if (g.t) add(at0 - 60 * 6e4, `ses:${g.caseNo}:${g.d}`, `⚖️ جلسة بعد ساعة — ${hm12(g.t)}`, who, 'm');
    else add(at(g.d, '08:00'), `ses:${g.caseNo}:${g.d}`, `⚖️ عندك جلسة اليوم`, who, 'm');
  }
  return out.sort((a, b) => a.at - b.at).slice(0, 80);
}
// المواعيد تُحسب من الشيت، فلا نرسل قبل تحميله: وإلا مُسحت مواعيد الناس بقائمةٍ ناقصة
let pushT = null;
const sent = {};
/* «أُسندت لك مهمة» من أي مصدر: الإسناد في الموقع، أو اسمٌ كُتب في عمود «المحامي» في الشيت.
   في الإعداد خريطة seen: لكل مهمة آخر من أُبلغ بها. فمهمةٌ مسندة لشخصٍ غير المسجّل فيها جديدةٌ عليه.
   وأول تشغيلٍ يسجّل الموجود كله بلا إشعار، وإلا انهالت على الفريق مهام قديمة دفعةً واحدة */
function markSeen(key, who) { S.cfg.seen = { ...(S.cfg.seen || {}), [key]: who }; DB.saveCfg({ seen: { [key]: who } }); }
function freshAssignments() {
  if ((!S.sheet.at && !S.sheet.cachedAt) || !S.docsReady) return {};
  const seen = S.cfg.seen || {}, open = items().filter(i => i.who && i.status !== 'done');
  if (!S.cfg.seenInit) {
    const all = {}; for (const i of open) all[i.key] = i.who;
    S.cfg.seen = all; S.cfg.seenInit = true; DB.saveCfg({ seen: all, seenInit: true }); return {};
  }
  // سكربت الشيت مركّب: هو يبلغ لحظة التعديل، فالموقع يسجّل ولا يكرّر الإشعار
  const quiet = !!S.cfg.hookOn;
  const out = {}, upd = {};
  for (const i of open) if (seen[i.key] !== i.who) {
    upd[i.key] = i.who;
    if (!quiet) (out[i.who] = out[i.who] || []).push({ at: Date.now() + 5000, k: `as:${i.key}:${i.who}`, title: `📌 أُسندت لك مهمة: «${i.title}»${leftTxt(i) ? ' — ' + leftTxt(i) : ''}`, body: [i.caseNo && 'القضية ' + i.caseNo, opp(i.row), !i.doc.assignee && 'من الشيت'].filter(Boolean).join(' · '), tab: i.kind, now: true });
  }
  if (Object.keys(upd).length) { S.cfg.seen = { ...seen, ...upd }; DB.saveCfg({ seen: upd }); }
  // تعديل المهلة: لكل مهمة آخر موعدٍ أُبلغ به صاحبها. تغيّر؟ يُبلَّغ، أيًّا كان من عدّله في الشيت.
  // والموعد المحسوب من «المتبقي» يتزحزح يومًا حول منتصف الليل، فيومٌ واحد فيه ليس تعديلًا
  const sd = S.cfg.seenDue || {}, updD = {}, val = i => i.due + (i.dueT ? ' ' + i.dueT : '');
  const withDue = open.filter(i => i.due);
  if (!S.cfg.seenDueInit) {
    for (const i of withDue) updD[i.key] = val(i);
    S.cfg.seenDue = updD; S.cfg.seenDueInit = true; DB.saveCfg({ seenDue: updD, seenDueInit: true }); return out;
  }
  for (const i of withDue) {
    const v = val(i), was = sd[i.key];
    if (was === v) continue;
    updD[i.key] = v;
    if (upd[i.key]) continue;  // جديدةٌ عليه: يكفيه إشعار الإسناد وفيه كم باقي
    // مهمةٌ معروفة بلا مهلة، ثم كُتبت لها مهلة أول مرة: «تحددت مهلة»
    if (!was) { if (seen[i.key] === i.who && !quiet) (out[i.who] = out[i.who] || []).push({ at: Date.now() + 5000, k: `dn:${i.key}:${v}`, title: `📅 تحددت مهلة «${i.title}» — ${hijri(i.due)}${i.dueT ? ' ' + hm12(i.dueT) : ''}`, body: [i.caseNo && 'القضية ' + i.caseNo, opp(i.row), leftTxt(i)].filter(Boolean).join(' · '), tab: i.kind, now: true }); continue; }
    const moved = Math.abs(diffD(i.due, was.slice(0, 10)));
    if (i.dueSrc === 'remain' && moved <= 1 && was.slice(11) === (i.dueT || '')) continue;
    if (!quiet) (out[i.who] = out[i.who] || []).push({ at: Date.now() + 5000, k: `dc:${i.key}:${v}`, title: `⏳ تعدّلت مهلة «${i.title}» — صارت ${hijri(i.due)}${i.dueT ? ' ' + hm12(i.dueT) : ''}`, body: [i.caseNo && 'القضية ' + i.caseNo, opp(i.row), 'كانت ' + hijri(was.slice(0, 10))].filter(Boolean).join(' · '), tab: i.kind, now: true });
  }
  if (Object.keys(updD).length) { S.cfg.seenDue = { ...sd, ...updD }; DB.saveCfg({ seenDue: updD }); }
  return out;
}
// الإرسال لا يحتاج أن يدعم هذا الجهاز الإشعارات: يكفيه أن يصل للخادم. فيُرسَل من أي متصفح،
// وحتى من سفاري الآيفون خارج أيقونة الشاشة الرئيسية
const pushLog = { at: null, n: 0, err: '', why: '', next: null, count: 0 };
let pendingPush = false;
async function syncAll(extra = {}, force) {
  if (DEMO) return;
  if (!S.cfg.subs || !Object.values(S.cfg.subs).some(d => Object.values(d || {}).some(Boolean))) { pushLog.why = 'لا أحد فعّل الإشعارات'; return; }
  // بلا الشيت تنقص المواعيد، فإرسالها يمسح ما عند الخادم. نؤجّل حتى يُحمَّل، وهو يرسل حينها
  if (!S.sheet.at && !S.sheet.cachedAt) { if (!pendingPush) toast('اضغط «تحميل الشيت» هنا في الموقع عشان توصل التنبيهات', true); pendingPush = true; pushLog.why = 'الشيت غير محمّل'; return; }
  pendingPush = false; pushLog.why = '';
  let fresh = {};
  try { fresh = freshAssignments(); } catch (e) { console.error('fresh', e); }
  extra = { ...extra }; for (const [n, L] of Object.entries(fresh)) extra[n] = [...(extra[n] || []), ...L];
  for (const [name, devs] of Object.entries(S.cfg.subs)) for (const sub of Object.values(devs || {})) {
    if (!sub || !sub.endpoint) continue;
    try {
      const list = schedule(name).concat(extra[name] || []), sig = JSON.stringify(list.filter(x => !x.now));
      if (!force && !extra[name] && sent[sub.endpoint] === sig) continue;
      // ومعها لمن الجهاز: بها يجده سكربت الشيت ليبلغه لحظة التعديل
      const r = await api('sync', { sub, items: list.map(({ now, ...x }) => x), who: name, group: 'hammadi' });
      if (r.ok) { sent[sub.endpoint] = sig; pushLog.at = new Date(); pushLog.n++; pushLog.err = ''; if (name === me()) { pushLog.count = r.count; pushLog.next = r.next; } }
      else pushLog.err = r.error || 'رفض الخادم';
    } catch (e) { console.error('push', e); pushLog.err = e.name === 'AbortError' ? 'الخادم ما ردّ خلال ٢٠ ثانية' : e.message || String(e); }
  }
  if (S.open?.type === 'menu') renderSheet();
}
// وضع التجربة: قائمة التنبيهات مكشوفة للفحص قبل النشر
if (DEMO) { window.__sched = schedule; window.__fresh = freshAssignments; }
// كل رجوعٍ للتطبيق يرسل المواعيد من جديد: الآيفون يوقف الصفحة في الخلفية، فقد يفوتها إرسالٌ بدأ قبلها
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && me()) syncPush(); });
// الشيت يُقرأ من جديد كل ٥ دقائق والموقع مفتوح، وعند الرجوع إليه بعد دقيقتين: فيُلحظ تعديلٌ فيه
// (مهمة جديدة أو مهلةٌ تغيّرت) خلال دقائق. وبلا إذنٍ صالح لا يفعل شيئًا، ولا يفتح نافذة دخول
const autoRead = () => { if (!document.hidden && S.user && me() && S.cfg.sheetId && !S.sheet.loading && (!S.sheet.at || Date.now() - S.sheet.at > 2 * 60e3)) loadSheet(false); };
setInterval(autoRead, 5 * 60e3);
document.addEventListener('visibilitychange', autoRead);
function syncPush() { clearTimeout(pushT); pushT = setTimeout(() => syncAll(), 2500); }
// إشعار فوري لعضو (أُسندت إليك…): يُضاف إلى قائمته ويُرسل الآن، فيصله خلال دقيقة
function pingNow(name, title, body, tab, key) {
  if (!S.cfg.subs?.[name]) return;
  clearTimeout(pushT);
  setTimeout(() => syncAll({ [name]: [{ at: Date.now() + 5000, k: `as:${key}:${Date.now()}`, title, body, tab, now: true }] }), 300);
}
async function enablePush() {
  if (!pushOK()) return toast('هذا المتصفح لا يدعم الإشعارات', true);
  if (isIOS && !standalone()) return toast('أضف الموقع للشاشة الرئيسية أولًا، وافتحه من أيقونته', true);
  try {
    const p = await Notification.requestPermission();
    if (p !== 'granted') return toast('ما سمحت بالإشعارات', true);
    const reg = swReg || await navigator.serviceWorker.ready;
    const { key } = await api('key');
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    const j = sub.toJSON();
    myEndpoint = j.endpoint; localStorage.setItem('hammadi.ep', myEndpoint);
    S.cfg.subs = { ...(S.cfg.subs || {}), [me()]: { ...(S.cfg.subs?.[me()] || {}), [hash(j.endpoint)]: j } };
    await DB.saveCfg({ subs: { [me()]: { [hash(j.endpoint)]: j } } });
    const t = await api('test', { sub: j });
    toast(t.ok ? '✓ تفعّلت، وجاك إشعار تجربة' : 'تفعّلت، بس التجربة ما وصلت: ' + t.error, !t.ok);
    syncAll();
  } catch (e) { console.error(e); toast('ما زبط التفعيل: ' + e.message, true); }
  renderSheet();
}
async function disablePush() {
  try { const r = swReg || await navigator.serviceWorker.ready; const sub = await r.pushManager.getSubscription(); if (sub) { await api('off', { endpoint: sub.endpoint }); await sub.unsubscribe(); } } catch (e) { console.error(e); }
  if (myEndpoint) { const m = { ...(S.cfg.subs?.[me()] || {}) }; delete m[hash(myEndpoint)]; S.cfg.subs = { ...S.cfg.subs, [me()]: m }; DB.saveCfg({ subs: { [me()]: { [hash(myEndpoint)]: null } } }); }
  myEndpoint = ''; localStorage.removeItem('hammadi.ep');
  toast('وقفت الإشعارات'); renderSheet();
}

/* ───────── البدء ───────── */
await initDB();
DB.onAuth(u => {
  S.user = u; S.cfgReady = false; S.docs = {}; S.denied = false; S.reqs = {};
  if (!u) return render();
  render();
  let first = true;
  DB.listen({
    cfg: c => { S.cfg = c || {}; S.cfgReady = true; const was = !!S.sheet.cachedAt; hydrate(); render(); if (first && me()) { first = false; loadSheet(false); } if (!was && S.sheet.cachedAt) syncPush(); },
    tasks: o => { const first = !S.docsReady; S.docs = o; S.docsReady = true; render(); if (first) syncPush(); },
    reqs: o => { const n = Object.keys(o).length, was = Object.keys(S.reqs).length; S.reqs = o; if (n > was) toast(`طلب دخول جديد — من الإعدادات`); if (S.open?.type === 'menu') renderSheet(); render(); },
    denied: () => { S.denied = true; render(); },
  });
});
</script>
