<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>يومي</title>
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="يومي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" id="appIcon" href="../icon.png">
<link rel="icon" id="favIcon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ألوان «مصروف»: خلفية فاتحة، وبطاقات بيضاء، وأخضر غامق. وفي الوضع الليلي ألوانه الليلية */
:root{
  --bg:#f4f5f2;--card:#ffffff;--card2:#eef1ec;--line:#e3e6e1;--text:#1b1f1d;--mute:#6b726e;
  --acc:#0f6b4f;--soft:#e3f1ea;--up:#2f6fdb;--low:#e07020;--off:#8a918d;--ok:#1f8a5b;--danger:#c0392b;--gold:#b7791f;
  --hero1:#16795a;--hero2:#0b4f3a;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --warn-bg:#fdf3e1;--warn-bd:#f0d9a8;--warn-tx:#8a5a00;
  --bad-bg:#fdecea;--bad-bd:#f3c2bc;--bad-tx:#a3271b;
  --info-bg:#e3f1ea;--info-bd:#bfe0cf;--info-tx:#0f5c44;
  --ok-bg:#e3f1ea;--ok-tx:#0f5132;--toastbad-bg:#fdecea;--toastbad-tx:#8f1f14;
  --pr-tx:#8a5a00;--flame-tx:#c2410c;--down:#c0392b;
  --pc:var(--acc);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111413;--card:#1a1e1c;--card2:#222825;--line:#2a302d;--text:#e9ece9;--mute:#98a19c;
  --acc:#3fb98a;--soft:#1d2d26;--up:#6c9cff;--low:#ff9a52;--off:#7d8682;--ok:#4cc08e;--danger:#ef6b5b;--gold:#f2c14e;
  --hero1:#1b6b52;--hero2:#123f31;--shadow:none;
  --warn-bg:#2a2410;--warn-bd:#5e4c14;--warn-tx:#f2c14e;
  --bad-bg:#2e1715;--bad-bd:#6e2a24;--bad-tx:#ffb4ab;
  --info-bg:#1d2d26;--info-bd:#2f5546;--info-tx:#9fe0c4;
  --ok-bg:#163326;--ok-tx:#c9f7d8;--toastbad-bg:#3a1f1c;--toastbad-tx:#ffd7d2;
  --pr-tx:#f2c14e;--flame-tx:#ffb37a;--down:#ff9b8f;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);min-height:100vh;
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 6px;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:23px;font-weight:700}
.sub{color:var(--mute);font-size:13px}
main{padding:8px 16px;display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:16px}
.meta{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{white-space:normal}
button{font:inherit;border-radius:12px;padding:11px 14px;cursor:pointer;color:var(--text);background:var(--card2);border:1px solid var(--line);transition:transform .12s,background .2s,opacity .2s;touch-action:manipulation}
button:active{transform:scale(.96)}
button.pri{background:var(--pc);border-color:var(--pc);color:#fff;font-weight:600}
button.okb{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
button.ghost{background:transparent}
button.sm{padding:6px 12px;font-size:13px;border-radius:10px}
button.link{background:none;border:0;padding:0;color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px}
button.x{padding:4px 8px;color:var(--danger);background:transparent;border-color:transparent;flex:none}
button.ic{padding:4px 8px;color:var(--mute);background:transparent;border-color:transparent;flex:none}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
h2{font-size:14px;font-weight:600;margin:6px 4px -4px;color:var(--mute);display:flex;align-items:center;gap:6px}
.empty{color:var(--mute);text-align:center;padding:20px}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* الرئيسية: شريط التنبيه، واليوم الجاري، والمربعات */
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;cursor:pointer;
  background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad-tx)}
.banner.info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info-tx)}
.banner .t{font-weight:700;font-size:15px}
.banner .s{font-size:13px;opacity:.8}
.banner svg{width:26px;height:26px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.alist{display:flex;flex-direction:column;gap:8px}
.alist .banner{padding:11px 14px}
.secttl{font-size:17px;font-weight:700;margin:6px 2px -2px}
.curday{display:flex;align-items:center;gap:14px;padding:18px 16px;cursor:pointer}
.icb{width:56px;height:56px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--acc)}
.icb svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chev{color:var(--mute);font-size:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 10px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:168px;justify-content:center;position:relative;box-shadow:var(--shadow)}
.tile:active{transform:scale(.97)}
.tile .icb{margin-bottom:8px}
.tile .tt{font-weight:700;font-size:17px}
.tile .ts{color:var(--mute);font-size:13px}
/* مؤقّت الراحة: عائمٌ فوق شريط التنقّل، برا الصفحة عشان ما تمسحه إعادة الرسم */
.rest-t{position:fixed;inset-inline:16px;bottom:calc(78px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;z-index:15;display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:20px;background:color-mix(in srgb,var(--card2) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 12px 34px -12px rgba(0,0,0,.35);animation:pageIn .3s ease}
.rest-t .rr{width:54px;height:54px;flex:none;position:relative}
.rest-t .rr svg{width:100%;height:100%;transform:rotate(-90deg)}
.rest-t .rr circle{fill:none;stroke-width:6}
.rest-t .rr .bgc{stroke:var(--line)}
.rest-t .rr .fg{stroke:var(--acc);stroke-linecap:round}
.rest-t .rr span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.rest-t .tt{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.rest-t.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card2))}
.rest-t.done .tt{color:var(--ok);font-size:19px}
.rest-t.done{animation:pulse 1s ease 3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.restrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.restrow .l{font-size:12px;color:var(--mute);margin-inline-end:2px}
.restrow button{padding:5px 11px;font-size:13px;border-radius:999px;background:transparent;color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
/* رسم التقدّم */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mute);font-size:10px;font-family:inherit}
.chart .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{stroke:var(--card);stroke-width:2}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.kpis div{background:var(--card2);border-radius:12px;padding:8px 4px;text-align:center}
.kpis b{display:block;font-size:17px}
.kpis span{font-size:11px;color:var(--mute)}
.item.tap{cursor:pointer}
/* تقرير الأسبوع */
.rep-c{background:linear-gradient(135deg,color-mix(in srgb,#a78bfa 20%,var(--card)),var(--card));border:1px solid color-mix(in srgb,#a78bfa 40%,transparent)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rgrid>div{background:color-mix(in srgb,var(--bg) 55%,transparent);border-radius:14px;padding:10px 12px}
.rgrid b{display:block;font-size:22px;line-height:1.2}
.rgrid span{font-size:12px;color:var(--mute)}
.rgrid i{display:block;font-style:normal;font-size:11.5px;font-weight:600;margin-top:2px}
.rgrid i.z{color:var(--mute);font-weight:500}
.rgrid i.u{color:var(--ok)}.rgrid i.d{color:var(--down)}
.rdots{display:flex;gap:5px;margin-top:6px}
.rdots s{flex:1;height:8px;border-radius:999px;background:var(--line);text-decoration:none}
.rdots s.on{background:var(--ok)}.rdots s.miss{background:color-mix(in srgb,var(--danger) 60%,transparent)}
/* شريط تقدّم صغير أسفل المربّع: تشوف وين وصلت قبل ما تفتحه */
.tbar{width:64%;height:5px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:8px}
.tbar i{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width .6s ease}
.tbar.full i{background:var(--ok)}
.tbar.late i{background:var(--danger)}.tbar.near i{background:var(--gold)}
/* التحية والسلسلة */
.hello{display:flex;align-items:center;gap:12px;padding:20px 18px;border-radius:24px;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;box-shadow:0 10px 30px -14px rgba(11,79,58,.6)}
.hello .hi{font-size:13px;color:rgba(255,255,255,.8)}
.hello .ln{color:#fff !important}
.hello .flame{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.hello .flame.cold{background:rgba(255,255,255,.08);color:rgba(255,255,255,.75)}
.hello .nm{font-size:20px;font-weight:700;line-height:1.3}
.hello .ln{font-size:13px;color:var(--text);opacity:.85;margin-top:2px}
.flame{flex:none;text-align:center;min-width:64px;padding:8px 10px;border-radius:16px;background:color-mix(in srgb,#ff8f45 16%,transparent);border:1px solid color-mix(in srgb,#ff8f45 40%,transparent);color:var(--flame-tx)}
.flame b{display:block;font-size:22px;line-height:1.1}
.flame span{font-size:11px}
.flame.cold{background:var(--card2);border-color:var(--line);color:var(--mute)}
.flame .f{font-size:20px;display:block;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-4deg)}}
/* رقم قياسي */
.pr{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:14px;font-weight:700;color:var(--pr-tx);
  background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 22%,var(--card2)),var(--card2));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);animation:pageIn .4s ease}
.pr .cup{font-size:24px;animation:bounce 1s ease 2}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* العدّ التنازلي في حلقة */
.cdr{position:relative;width:84px;height:84px;flex:none}
.cdr svg{width:100%;height:100%;transform:rotate(-90deg)}
.cdr circle{fill:none;stroke-width:7}
.cdr .bgc{stroke:var(--card2)}
.cdr .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.cdr.near .fg{stroke:var(--gold)}.cdr.late .fg{stroke:var(--danger)}.cdr.done .fg{stroke:var(--ok)}
.cdr .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cdr .in b{font-size:26px;line-height:1;color:var(--acc)}
.cdr.near .in b{color:var(--gold)}.cdr.late .in b{color:var(--danger)}.cdr.done .in b{color:var(--ok)}
.cdr .in small{font-size:10.5px;color:var(--mute);margin-top:3px;line-height:1.2}
/* ملخّص الأسبوع: اليوم اللي خلص أخضر، واللي نصّه بشريط */
.wsum div{position:relative;overflow:hidden}
.wsum div.all{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.wsum div.all b{color:var(--ok)}
.wsum div u{position:absolute;bottom:0;inset-inline-start:0;height:3px;background:var(--acc);text-decoration:none}
.tile .dot{position:absolute;top:12px;inset-inline-start:12px;min-width:22px;height:22px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}

/* المهام */
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;padding:0;flex:none;border:1.5px solid var(--mute);background:transparent;color:#fff;font-size:13px;font-weight:700;margin-top:1px}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.task .tt{font-weight:600}
.task .nt{color:var(--mute);font-size:13px;white-space:pre-wrap}
.tm{font-size:12px;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:999px;padding:2px 9px;white-space:nowrap;flex:none;margin-top:2px}
.rep{font-size:12px;color:var(--mute);flex:none;margin-top:3px}
.wday{border-inline-start:4px solid var(--line)}
.wday.today{border-inline-start-color:var(--acc);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),var(--card))}
.wday.past{opacity:.75}
.wsum{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wsum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 0;text-align:center;font-size:10.5px;color:var(--mute);cursor:pointer}
.wsum b{display:block;font-size:16px;color:var(--text)}
.wsum .today{border-color:var(--acc)}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cd{font-size:34px;font-weight:700;line-height:1;color:var(--acc);text-align:center;min-width:74px}
.cd small{display:block;font-size:12px;color:var(--mute);font-weight:500;margin-top:4px}
.cd.late{color:var(--danger)}.cd.near{color:var(--gold)}
.bar{height:7px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px}
.form{display:flex;flex-direction:column;gap:8px}
.form label{font-size:12px;color:var(--mute);margin:4px 2px -2px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin-top:4px}
.check input{width:20px;height:20px;flex:none;accent-color:var(--acc)}
textarea{font:inherit;font-size:16px;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:64px;resize:vertical}
input,select{font:inherit;font-size:16px;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:600}
input.txt,select.txt{text-align:right;font-weight:500}
input[type=date],input[type=time]{min-height:44px;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
.tl{display:flex;flex-direction:column}
.tl .gymrow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--pc) 16%,var(--card2));border:1px solid color-mix(in srgb,var(--pc) 40%,transparent);cursor:pointer}

/* النادي — من موقع النادي نفسه */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;border:1px solid color-mix(in srgb,var(--pc) 40%,transparent);
  background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 30%,var(--card)) 0%,var(--card) 70%)}
.hero .big{font-size:34px;font-weight:700;line-height:1.2}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:18px;line-height:1.1}
.ring .t small{font-size:10px;color:var(--mute);font-weight:500}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:color-mix(in srgb,var(--text) 10%,transparent)}
.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:5px 14px;font-size:13px;border-radius:999px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 0;text-align:center;font-size:10.5px;color:var(--mute);white-space:nowrap;cursor:pointer;position:relative}
.wd i{display:block;width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:var(--pc)}
.wd.today{border-color:var(--text);background:var(--card2)}
.wd .miss{position:absolute;top:2px;inset-inline-end:5px;color:var(--danger);font-size:10px;font-weight:700}
.warnline{margin-top:10px;font-size:12.5px;color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:10px;padding:6px 10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;transition:border-color .3s,box-shadow .3s}
.ex .head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.ex.open{border-color:color-mix(in srgb,var(--pc) 60%,transparent);box-shadow:0 8px 30px -12px color-mix(in srgb,var(--pc) 50%,transparent)}
.ex.isdone{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.ex .body{padding:0 14px 14px}
.badge{width:46px;height:46px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
  background:hsl(var(--h) 60% 50% / .16);color:hsl(var(--h) 60% 36%)}
@media (prefers-color-scheme: dark){.badge{color:hsl(var(--h) 85% 72%)}}
.thumb{width:46px;height:46px;border-radius:13px;flex:none;object-fit:cover;background:var(--card2)}
.exphoto{width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:block;margin-bottom:6px;cursor:zoom-in;background:var(--card2)}
.addphoto{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border:1.5px dashed var(--line);border-radius:14px;background:transparent;color:var(--mute);font-size:13px;margin-bottom:6px}
.zoom{position:fixed;inset:0;background:#000d;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.zoom img{max-width:100%;max-height:100%;border-radius:12px}
.st{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute);border:1.5px solid var(--line)}

<body>
<div id="app"><div class="login"><div class="sub">جاري التحميل…</div></div></div>
<input type="file" id="imgPick" accept="image/*" hidden>
<div id="restBox"></div>
<script type="module">
// ?demo يشغّل التطبيق كاملًا ببياناتٍ في الجهاز بلا Firebase: للتجربة والفحص قبل النشر
const DEMO = new URLSearchParams(location.search).has('demo');

// أيقونة الشاشة الرئيسية: صورة يختارها صاحب التطبيق بنفسه. الآيفون يأخذ الأيقونة لحظة
// «إضافة إلى الشاشة الرئيسية»، فتُحفظ في الجهاز وتُوضع في الصفحة قبل أي شي ثاني
const DEF_ICON = '../icon.png';
let myIcon = null;
try { myIcon = localStorage.getItem('yawmi.icon'); } catch (e) { }
function applyIcon(d) {
  myIcon = d || null;
  try { d ? localStorage.setItem('yawmi.icon', d) : localStorage.removeItem('yawmi.icon'); } catch (e) { }
  for (const id of ['appIcon', 'favIcon']) document.getElementById(id).href = myIcon || DEF_ICON;
}
applyIcon(myIcon);

// تاريخ اليوم بتوقيت الجهاز، لأن «اليوم» عند صاحبه هو يومه هو لا يوم UTC
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
let TODAY = iso(new Date());
const P = s => new Date(s + 'T12:00');
const addD = (s, k) => { const d = P(s); d.setDate(d.getDate() + k); return iso(d); };
const dow = s => P(s).getDay();
const diffD = (a, b) => Math.round((P(a) - P(b)) / 864e5);
// الأسبوع يبدأ بالسبت
const wkStart = s => addD(s, -((dow(s) + 1) % 7));
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const SHORT = ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];
const WEEK = [6, 0, 1, 2, 3, 4, 5];
const SYS = { ul: 'علوي وسفلي', custom: 'تقسيمي' };
const OFF = '#7b8496';
const COLORS = ['#a78bfa', '#5b8cff', '#34d399', '#ff8f45', '#f472b6', '#fbbf24', '#22d3ee', '#ef4444'];
const n = x => Number(x || 0).toLocaleString('ar-SA', { maximumFractionDigits: 2 });
// تمييز العدد: ١ يوم، ٢ يومين، ٣–١٠ أيام، ١١+ يوم
const say = (k, one, two, few) => k == 1 ? one : k == 2 ? two : k >= 3 && k <= 10 ? few : one;
const cnt = (k, one, two, few) => k == 1 ? one : k == 2 ? two : `${n(k)} ${say(k, one, two, few)}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
const tint = (c, p = 20) => `color-mix(in srgb,${c} ${p}%,transparent)`;
const pill = (name, c) => `<span class="pill" style="background:${tint(c)};color:${c}">${esc(name)}</span>`;
const dm = s => `${n(+s.slice(8))}/${n(+s.slice(5, 7))}`;
const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function hm(t) {
  if (!t) return '';
  let [h, m] = t.split(':').map(Number);
  const pm = h >= 12; h = h % 12 || 12;
  return `${n(h)}:${String(m).padStart(2, '0').replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d])} ${pm ? 'م' : 'ص'}`;
}
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ───────── التخزين: Firebase، أو الجهاز في وضع التجربة ───────── */
let DB;
async function initDB() {
  if (DEMO) {
    const K = 'yawmi.demo';
    let D; try { D = JSON.parse(localStorage.getItem(K)) || {}; } catch (e) { D = {}; }
    D.logs = D.logs || {}; D.img = D.img || {};
    const put = () => { try { localStorage.setItem(K, JSON.stringify(D)); } catch (e) { toast('مساحة الجهاز ممتلئة', true); } };
    DB = {
      onAuth: cb => cb({ uid: 'demo', displayName: localStorage.getItem('yawmi.demoName') || 'وضع التجربة', email: 'البيانات في هذا الجهاز فقط' }),
      login() { }, logout() { localStorage.removeItem(K); location.reload(); },
      listen(u, h) { if (localStorage.getItem('yawmi.demoHang')) return []; setTimeout(() => { h.profile(D.profile || null, false); h.logs({ ...D.logs }); h.y(D.y || null, false); h.img({ ...D.img }); }, 50); return []; },
      saveProfile: p => { D.profile = p; put(); },
      saveLog: (date, id, sets, day) => { const r = D.logs[date] = D.logs[date] || { items: {} }; r.items = r.items || {}; r.items[id] = sets; if (day) r.day = day; put(); },
      delLog: (date, id) => { const r = D.logs[date]; if (r && r.items) delete r.items[id]; put(); },
      saveAct: (date, name, min) => { const r = D.logs[date] = D.logs[date] || { items: {} }; r.acts = r.acts || {}; r.acts[name] = min; put(); },
      delAct: (date, name) => { const r = D.logs[date]; if (r && r.acts) delete r.acts[name]; put(); },
      saveY: y => { D.y = y; put(); },
      saveImg: (id, d) => { D.img[id] = d; put(); },
      delImg: id => { delete D.img[id]; put(); },
    };
    return;
  }
  const V = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [{ initializeApp }, A, F] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  // نفس مشروع «النادي»: الحساب نفسه والتمارين نفسها وسجلّها
  const fb = initializeApp({
    apiKey: 'AIzaSyA5r6_WfSII1hp5LSqWnTmMrqm28RjTySE',
    authDomain: 'saleh-285a6.firebaseapp.com',
    projectId: 'saleh-285a6',
    storageBucket: 'saleh-285a6.firebasestorage.app',
    messagingSenderId: '669710052588',
    appId: '1:669710052588:web:8acc0f4ca4ac09dd68c9c9',
  });
  const auth = A.getAuth(fb);
  let db;
  // النسخة المحلية في الجهاز تخلّي التسجيل يشتغل لو ضعفت الشبكة. بس الآيفون من أيقونة الشاشة
  // الرئيسية يعلق أحيانًا وهو يفتحها، فلا يوصل شي. فلو علق مرة، نكمل بدونها (yawmi.nocache)
  let noCache = false;
  try { noCache = localStorage.getItem('yawmi.nocache') === '1'; } catch (e) { }
  try { db = noCache ? F.initializeFirestore(fb, {}) : F.initializeFirestore(fb, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { db = F.initializeFirestore(fb, {}); }
  const U = () => auth.currentUser.uid;
  DB = {
    onAuth: cb => A.onAuthStateChanged(auth, cb),
    async login() {
      const provider = new A.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      try { await A.signInWithPopup(auth, provider); }
      catch (e) {
        if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return A.signInWithRedirect(auth, provider);
        renderLogin(e.code === 'auth/unauthorized-domain' ? 'هذا الرابط غير مسموح في إعدادات Firebase (Authorized domains).' : 'ما زبط الدخول: ' + (e.code || e.message));
      }
    },
    logout: () => A.signOut(auth),
    listen(u, h) {
      const bad = what => e => { console.error(e); toast(`ما قدرت أقرأ ${what}: ${e.code || e.message}`, true); };
      return [
        F.onSnapshot(F.doc(db, 'users', u), s => h.profile(s.exists() ? s.data() : null, s.metadata.fromCache, s.metadata.hasPendingWrites), bad('الحساب')),
        F.onSnapshot(F.collection(db, 'users', u, 'logs'), qs => { const o = {}; qs.forEach(d => { o[d.id] = d.data(); }); h.logs(o, qs.metadata.hasPendingWrites); }, bad('السجل')),
        F.onSnapshot(F.doc(db, 'users', u, 'yawmi', 'main'), s => h.y(s.exists() ? s.data() : null, s.metadata.fromCache, s.metadata.hasPendingWrites), e => { bad('المهام')(e); h.y(null, false); }),
        F.onSnapshot(F.collection(db, 'users', u, 'img'), qs => { const o = {}; qs.forEach(d => { o[d.id] = d.data().d; }); h.img(o); }, e => { console.error(e); h.img({}); }),
      ];
    },
    // شكل الحساب نفسه اللي يكتبه موقع النادي، فالموقعان يشتغلان على البيانات نفسها
    saveProfile: p => F.setDoc(F.doc(db, 'users', U()), p).catch(fail),
    saveLog: (date, id, sets, day) => F.setDoc(F.doc(db, 'users', U(), 'logs', date), { items: { [id]: sets }, ...(day ? { day } : {}) }, { merge: true }).catch(fail),
    // الحذف بمسار الحقل نفسه: يشيل التمرين أو النشاط ويخلّي باقي اليوم
    delLog: (date, id) => F.updateDoc(F.doc(db, 'users', U(), 'logs', date), new F.FieldPath('items', id), F.deleteField()).catch(fail),
    // النشاط (كورة، مشي…) في نفس مستند اليوم تحت acts، و«النادي» القديم ما يقرأه ولا يمسحه
    saveAct: (date, name, min) => F.setDoc(F.doc(db, 'users', U(), 'logs', date), { acts: { [name]: min } }, { merge: true }).catch(fail),
    delAct: (date, name) => F.updateDoc(F.doc(db, 'users', U(), 'logs', date), new F.FieldPath('acts', name), F.deleteField()).catch(fail),
    saveY: y => F.setDoc(F.doc(db, 'users', U(), 'yawmi', 'main'), y).catch(fail),
    // الصورة في مستندٍ لحالها: مستند الحساب يقرؤه موقع النادي القديم ويكتبه كاملًا، فلا نثقّله
    saveImg: (id, d) => F.setDoc(F.doc(db, 'users', U(), 'img', id), { d }).catch(fail),
    delImg: id => F.deleteDoc(F.doc(db, 'users', U(), 'img', id)).catch(fail),
  };
}

/* ───────── الحالة ───────── */
let USER = null, S = null, Y = null, IMG = {}, logsByDate = {}, unsubs = [], choosing = false;
let L = { tab: 'home', gv: 'day', sess: null, hist: 'days', exv: 'days', wk: 0, showAlerts: false };
try { L = Object.assign(L, JSON.parse(localStorage.getItem('yawmi.local')) || {}); } catch (e) { }
const saveLocal = () => { try { localStorage.setItem('yawmi.local', JSON.stringify({ tab: L.tab, gv: L.gv, sess: L.sess, uid: L.uid, hist: L.hist, exv: L.exv })); } catch (e) { } };
const qTab = new URLSearchParams(location.search).get('tab');
if (qTab) L.tab = qTab;
let flash = null;
// ما يتحرّك في الرسمة الجاية: المهمة اللي انضغطت، والجديد اللي انضاف، والصفحة اللي انفتحت
let fx = {};
const RING = {};

/* ───────── الجدول بالترتيب ─────────
   الترتيب (مثل علوي ← سفلي ← أوف) يتكرّر، وكل يوم يكمل من آخر تمرين سوّيته، لا من اسم اليوم.
   فلو أخذت أوف في يوم تمرين، التمرين ينتقل لبكرة والباقي يتأخر يوم. ولو اخترت غير
   المقترح، اللي بعده يكمل من اختيارك */
const cycle = () => {
  const c = (SET().cycle || []).filter(x => x === 'off' || dayById(x));
  return c.length ? c : [...plan().days.map(d => d.id), 'off'];

// أقرب مكان لهالتمرين في الترتيب بعد المكان الحالي (الترتيب ممكن يتكرر فيه التمرين نفسه)
const nextIdx = (c, i, id) => { for (let k = 1; k <= c.length; k++) { const j = ((i + k) % c.length + c.length) % c.length; if (c[j] === id) return j; } return i; };
// آخر مكانٍ وصلت له في الترتيب قبل اليوم: من المحفوظ لو تدرّبت فعلًا ذاك اليوم، وإلا من آخر تمرين بالسجل
function cycleBase() {
  const c = cycle(), ptr = SET().cptr;
  const ld = Object.keys(logsByDate).filter(d => d < TODAY && logsByDate[d].day?.id && c.includes(logsByDate[d].day.id)).sort().pop();
  if (ptr && ptr.d < TODAY && loggedOn(ptr.d) && (!ld || ptr.d >= ld) && ptr.i < c.length) return ptr.i;
  return ld ? c.indexOf(logsByDate[ld].day.id) : -1;
}
// تمرين كل يوم من اليوم لقدّام، والمقترح لليوم لو ما اخترت
function projection(n = 16) {
  const c = cycle(), out = {};
  let i = cycleBase();
  const pick = L.sess && L.sess.date === TODAY ? L.sess.part : null;
  const doneId = logsByDate[TODAY]?.day?.id;
  for (let k = 0; k < n; k++) {
    const d = addD(TODAY, k);
    if (k === 0) {
      const id = pick ?? (doneId && c.includes(doneId) ? doneId : null);
      if (id === 'off') {
        // أوف مخطّط ينحسب، وأوف بدال تمرين ما ينحسب: التمرين يتأجل لبكرة
        if (c[(i + 1) % c.length] === 'off') i = (i + 1) % c.length;
        out[d] = 'off'; continue;
      }
      if (id) { i = nextIdx(c, i, id); out[d] = id; continue; }
    }
    i = (i + 1) % c.length; out[d] = c[i];
  }
  return out;
}
let projCache = null;

function spark(vals, c) {
  const W = 90, H = 32, Pd = 4, mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
  const pts = vals.map((v, i) => [Pd + (W - 2 * Pd) * (vals.length > 1 ? i / (vals.length - 1) : .5), H - Pd - (H - 2 * Pd) * (v - mn) / sp]);
  const last = pts[pts.length - 1];
  return `<svg class="spark" style="--pc:${c}" viewBox="0 0 ${W} ${H}"><polyline points="${pts.map(p => p.join(',')).join(' ')}"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5"/></svg>`;
}
const ACT_C = '#16a34a';
function logDay(d) {
  const L0 = logsByDate[d];
  if (L0.day && L0.day.name) return L0.day;
  // يوم فيه نشاط بس (كورة…): اسمه اسم النشاط
  if (!Object.keys(L0.items || {}).length && Object.keys(L0.acts || {}).length) return { name: Object.keys(L0.acts).join(' و'), color: ACT_C };
  const ids = Object.keys(L0.items || {});
  for (const sys of ['ul', 'custom']) {
    const x = S.plans[sys].days.find(dd => ids.some(id => dd.ex.includes(id)));
    if (x) return x;
  }
  return { name: 'تمرين', color: OFF };
}

function viewHist() {
  let h = `<div class="seg" style="margin-top:0"><button class="${L.hist !== 'prog' ? 'on' : ''}" data-act="hist" data-v="days">الأيام</button><button class="${L.hist === 'prog' ? 'on' : ''}" data-act="hist" data-v="prog">التقدّم</button></div>`;
  if (L.hist === 'prog') {
    const rows = S.ex.filter(e => (S.logs[e.id] || []).length).map(e => {
      const ls = S.logs[e.id], top = ls.map(l => Math.max(...l.sets.map(s => +s.weight || 0))), reps = ls.map(l => Math.max(...l.sets.map(s => +s.reps || 0)));
      const useW = top.some(v => v > 0), vals = useW ? top : reps, diff = vals[vals.length - 1] - vals[0];
      return `<div class="item tap" data-act="chart" data-v="${e.id}">${badge(e)}<div class="grow"><div class="name" style="font-size:15px">${esc(e.name)}</div>
        <div class="meta">${useW ? `أعلى وزن ${n(vals[vals.length - 1])} كجم` : `${n(vals[vals.length - 1])} عدّة`} · ${n(ls.length)} ${say(ls.length, 'مرة', 'مرتين', 'مرات')}
        ${diff > 0 ? ` · <span class="up">▲ ${n(diff)}${useW ? ' كجم' : ''}</span>` : ''}</div></div>${spark(vals, exColor(e.id))}<span class="chev">‹</span></div>`;
    });
    return h + (rows.length ? `<div class="card list">${rows.join('')}</div>` : '<div class="empty">سجّل كم تمرين ويطلع لك تقدّمك هنا</div>');
  }
  const dates = Object.keys(logsByDate).filter(loggedOn).sort().reverse();
  h += pastForm();
  if (!dates.length) return h + '<div class="empty">ما سجّلت شي للحين</div>';
  // أيام الأوف بين أول تسجيل وأمس، تنعرض في مكانها من السجل
  const first = dates[dates.length - 1], all = [];
  for (let d = addD(TODAY, -1); d >= first && all.length < 120; d = addD(d, -1)) all.push(d);
  if (loggedOn(TODAY)) all.unshift(TODAY);
  let offRun = [];
  const flush = () => {
    if (!offRun.length) return '';
    const r = offRun; offRun = [];
    const a = r[r.length - 1], b = r[0];
    return `<div class="card" style="padding:10px 14px;opacity:.75"><div class="row between"><span class="sub">${r.length === 1 ? fmtDate(a) : `${fmtDate(a)} ← ${fmtDate(b)}`}</span>${pill(r.length === 1 ? 'أوف' : `أوف · ${cnt(r.length, 'يوم', 'يومين', 'أيام')}`, OFF)}</div></div>`;
  };
  let out = '';
  for (const d of all) {
    if (!loggedOn(d)) { offRun.push(d); continue; }

/* ───────── مؤقّت الراحة ─────────
   ينحسب من وقت النهاية لا بالعدّ: لو طلعت من التطبيق ورجعت، يكمل من مكانه الصح.

const RESTS = [60, 90, 120, 180];

      g.gain.setValueAtTime(.0001, A.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, A.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, A.currentTime + t + .18);

/* ───────── رسم تقدّم التمرين ───────── */
// لكل مرة: أعلى وزن (أو أعلى عدّات للتمرين اللي بلا وزن). والرقم القياسي نقطة ذهبية
function exSeries(id) {
  const ls = S.logs[id] || [];
  const w = ls.map(l => Math.max(...l.sets.map(x => +x.weight || 0)));
  const useW = w.some(v => v > 0);
  return { ls, useW, vals: useW ? w : ls.map(l => Math.max(...l.sets.map(x => +x.reps || 0))), unit: useW ? 'كجم' : 'عدّة' };

function bigChart(vals, dates, c) {
  const W = 340, H = 190, pl = 34, pr = 12, pt = 16, pb = 26;
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mn === mx) { mn -= 5; mx += 5; }
  const pad = (mx - mn) * .12; mn = Math.max(0, mn - pad); mx += pad;
  // الزمن من اليسار لليمين مثل أي رسم بياني
  const X = i => pl + (W - pl - pr) * (vals.length > 1 ? i / (vals.length - 1) : .5), Yv = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  const ticks = [0, .5, 1].map(f => mn + (mx - mn) * f);
  const pts = vals.map((v, i) => [X(i), Yv(v)]);
  let best = -Infinity;
  const prs = vals.map((v, i) => { const isPr = i > 0 && v > best; best = Math.max(best, v); return isPr; });
  const area = `M${pts[0][0]},${H - pb} L${pts.map(p => p.join(',')).join(' L')} L${pts[pts.length - 1][0]},${H - pb} Z`;
  const lbl = d => `${+d.slice(8)}/${+d.slice(5, 7)}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="direction:ltr"><defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Yv(t)}" y2="${Yv(t)}"/><text class="ax" x="${pl - 6}" y="${Yv(t) + 3}" text-anchor="end">${Math.round(t)}</text>`).join('')}
    <path d="${area}" fill="url(#cg)"/><polyline class="ln" stroke="${c}" points="${pts.map(p => p.join(',')).join(' ')}"/>
    ${pts.map((p, i) => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="${prs[i] ? 6 : 4}" fill="${prs[i] ? '#fbbf24' : c}"/>`).join('')}
    <text class="ax" x="${pts[0][0]}" y="${H - 8}" text-anchor="${vals.length > 1 ? 'start' : 'middle'}">${lbl(dates[0])}</text>
    ${vals.length > 1 ? `<text class="ax" x="${pts[pts.length - 1][0]}" y="${H - 8}" text-anchor="end">${lbl(dates[dates.length - 1])}</text>` : ''}</svg>`;
}
function viewChart() {

/* ───────── تقرير الأسبوع ───────── */
// أسبوع من السبت للجمعة: النادي، والمهام، والأرقام القياسية، ومقارنة بالأسبوع اللي قبله
function weekStats(ws) {
  const days = Array.from({ length: 7 }, (_, i) => addD(ws, i)), upto = days.filter(d => d <= TODAY);
  const gym = days.map(d => loggedOn(d) ? 'on' : d < TODAY && S && !manual() && schedOf(dow(d)) !== 'off' ? 'miss' : '');
  const planned = manual() ? 0 : upto.filter(d => S && schedOf(dow(d)) !== 'off').length;
  const went = days.filter(loggedOn).length;
  let kg = 0, prs = 0;
  for (const d of days) if (loggedOn(d)) for (const [id, sets] of Object.entries(logsByDate[d].items)) {
    kg += sets.reduce((a, x) => a + (+x.reps || 0) * (+x.weight || 0), 0);
    const before = (S.logs[id] || []).filter(l => l.date < d);
    if (before.length && Math.max(...sets.map(x => +x.weight || 0)) > Math.max(...before.flatMap(l => l.sets.map(x => +x.weight || 0)))) prs++;
  }
  const tl = days.flatMap(d => tasksOn(d).map(t => isDone(t, d)));

}

function alerts(forNotify) {

  }

  for (const r of remsOn(TODAY)) if (r.time <= now) out.push({ k: `r:${r.id}:${TODAY}`, lvl: 'info', t: '🔔 ' + r.title, s: hm(r.time), tab: 'rem', quiet: true, fresh: r.time });
  for (const t of tasksOn(TODAY)) if (t.time && t.time <= now && !isDone(t, TODAY)) out.push({ k: `t:${t.id}:${TODAY}`, lvl: 'info', t: t.title, s: `مهمة اليوم · ${hm(t.time)}`, tab: 'today', fresh: t.time });
  const ws = wkStart(TODAY), wt = Array.from({ length: 7 }, (_, i) => addD(ws, i)).filter(d => d >= TODAY).reduce((a, d) => a + tasksOn(d).filter(t => !isDone(t, d)).length, 0);
  // المهمة البعيدة القريبة لها شريطها فوق، فلا نكرّرها في الشريط (والإشعار يوصل)
  out.push(...preAlerts().filter(a => !(!forNotify && a.long && daysLeft(a.long) <= 3)));
  if (dow(TODAY) === 6 && nowHM() >= SET().weekTime) out.push({ k: 'w:' + ws, lvl: 'info', t: '📋 وش عندك هالأسبوع', s: weekFull(ws), tab: 'week' });

// تذكيرات «قبلها»: لكل موعد جاي، أقرب «قبل» فات وقته. والمفتاح فيه «القبل» نفسه،
// فلو اخترت «قبل يوم» و«قبل ساعة» يجيك إشعارين
function leftTxt(min, d) {
  if (min < 60) return `بعد ${cnt(Math.max(1, min), 'دقيقة', 'دقيقتين', 'دقائق')}`;
  if (min < 1440 && d === TODAY) return `بعد ${cnt(Math.round(min / 60), 'ساعة', 'ساعتين', 'ساعات')}`;
  const k = diffD(d, TODAY);
  return k === 1 ? 'بكرة' : `بعد ${cnt(k, 'يوم', 'يومين', 'أيام')}`;
}
function preAlerts() {
  const out = [], now = new Date();
  const add = (x, d, t, title, tab) => {
    if (!x.pre || !x.pre.length) return;
    const occ = new Date(d + 'T' + (t || DEF_T));
    if (occ <= now) return;
    const m = x.pre.filter(p => occ - p * 6e4 <= now).sort((a, b) => a - b)[0];
    if (m === undefined) return;
    out.push({ k: `p:${x.id}:${d}:${m}`, lvl: 'info', t: title, s: `${leftTxt(Math.round((occ - now) / 6e4), d)} · ${fmtDate(d)} ${hm(t || DEF_T)}`, tab, long: tab === 'long' ? x : null });
  };
  for (let i = 0; i <= 8; i++) {
    const d = addD(TODAY, i);
    for (const t of tasksOn(d)) if (!isDone(t, d)) add(t, d, t.time, t.title, i === 0 ? 'today' : 'week');
    for (const r of remsOn(d)) add(r, d, r.time, '🔔 ' + r.title, 'rem');
  }
  for (const l of Y.longs) if (!l.done) add(l, l.due, DEF_T, `«${l.title}»`, 'long');
  return out;
}

// مواعيد الأيام التسعة الجاية: نفس اللي يطلع في الشريط، بس محسوبة لوقتها
function schedule() {
  const out = [], now = Date.now(), at = (d, t) => new Date(d + 'T' + (t || DEF_T)).getTime();
  const add = (ms, k, title, body, tab) => { if (ms > now) out.push({ at: ms, k, title, body, tab }); };
  const when = (d, t) => `${DAYS[dow(d)]} ${dm(d)} · ${hm(t || DEF_T)}`;
  const pres = (x, d, t, title, tab) => (x.pre || []).forEach(m => add(at(d, t) - m * 6e4, `p:${x.id}:${d}:${m}`, title, `${PRE.find(p => p[0] === m)?.[1].replace('قبل', 'بعد') || ''} · ${when(d, t)}`, tab));
  for (let i = 0; i <= 8; i++) {
    const d = addD(TODAY, i);
    for (const t of tasksOn(d)) if (!isDone(t, d)) {
      if (t.time) add(at(d, t.time), `t:${t.id}:${d}`, t.title, t.note || `مهمة · ${hm(t.time)}`, 'today');
      pres(t, d, t.time, t.title, i ? 'week' : 'today');
    }
    for (const r of remsOn(d)) { add(at(d, r.time), `r:${r.id}:${d}`, '🔔 ' + r.title, hm(r.time), 'rem'); pres(r, d, r.time, '🔔 ' + r.title, 'rem'); }
    // يوم تمرين ما انسجّل فيه شي: «ترا ما رحت النادي». ولو سجّلت، المزامنة تشيله
    if (S && plan().days.length && planOn(d) && planOn(d) !== 'off' && !loggedOn(d))
      add(at(d, Y.set.gymTime || '21:00'), `g:${d}`, 'ترا ما رحت النادي اليوم', `اليوم ${nameOf(planOn(d))}، ولو ما سجّلت شي قبل ١١:٥٩ م ينحسب أوف`, 'gym');
    if (dow(d) === 6) add(at(d, SET().weekTime), `w:${d}`, '📋 وش عندك هالأسبوع', weekFull(d), 'week');
  }
  for (const l of Y.longs) if (!l.done) {
    add(at(l.due, DEF_T), `ld:${l.id}`, `«${l.title}»: اليوم آخر يوم`, 'مهمة بعيدة المدى', 'long');
    pres(l, l.due, DEF_T, `«${l.title}»`, 'long');
  }
  // يومين أوف ورا بعض: الثالث «لازم تروح». من آخر يوم سجّلت فيه
  if (S) {
    const last = Object.keys(logsByDate).filter(loggedOn).sort().pop();

      const d = addD(last, k);
      if (d >= TODAY && d <= addD(TODAY, 8)) add(at(d, '10:00'), `s:${d}`, 'لازم تروح النادي اليوم', `صار لك ${cnt(k - 1, 'يوم', 'يومين', 'أيام')} أوف`, 'gym');
    }
  }
  for (let i = 0; i <= 8; i++) {
    const d = addD(TODAY, i);

function ics(name, evs) {
  const e = s => String(s).replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const st = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//yawmi//ar', 'CALSCALE:GREGORIAN'];
  for (const v of evs) lines.push('BEGIN:VEVENT', `UID:${v.uid}@yawmi`, `DTSTAMP:${st}`, `DTSTART:${v.date.replace(/-/g, '')}T${v.time.replace(':', '')}00`, 'DURATION:PT15M',
    `SUMMARY:${e(v.title)}`, ...(v.desc ? [`DESCRIPTION:${e(v.desc)}`] : []), ...(v.rrule ? [`RRULE:${v.rrule}`] : []),
    ...[0, ...(v.pre || [])].flatMap(m => ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${e(v.title)}`, `TRIGGER:${m ? '-' : ''}PT${m}M`, 'END:VALARM']), 'END:VEVENT');
  lines.push('END:VCALENDAR');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' }));
  a.download = name + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// الصورة تُصغَّر في الجهاز قبل الحفظ: صورة الجوال ٣ ميقا، والمستند ما يتحمّل أكثر من ميقا
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    const M = 520, k = Math.min(1, M / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}
// الأيقونة مربّعة: نقصّ وسط الصورة بدل ما نمطّها
async function squareIcon(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight, m = Math.min(w, h), S0 = 180;
    const c = document.createElement('canvas'); c.width = c.height = S0;
    c.getContext('2d').drawImage(img, (w - m) / 2, (h - m) / 2, m, m, 0, 0, S0, S0);
    return c.toDataURL('image/jpeg', 0.88);
  } finally { URL.revokeObjectURL(url); }
}

        if (F.kind === 'task' && val.wd != null && arr[k].wd === val.wd && arr[k].from) val.from = arr[k].from;

      }

      else { const nid = uid(F.kind[0]); arr.push({ id: nid, ...val, ...(F.kind === 'task' ? { done: {} } : {}) }); fx.added = nid; }

    case 'tdone': {

    case 'wk': L.wk += +v; L.form = null; break;

    case 'icsRem': {

    case 'showPart': L.showPart = true; break;
    case 'todayPart': {
      session().part = v; session().open = undefined; L.showPart = false;

    }
    case 'cyUp': case 'cyDown': case 'cyDel': case 'cyAdd': {

      if (act === 'cyUp' && i > 0) [c[i - 1], c[i]] = [c[i], c[i - 1]];
      if (act === 'cyDown' && i < c.length - 1) [c[i + 1], c[i]] = [c[i], c[i + 1]];

    case 'actDel': {

    }
    case 'fskip': {
      const F = L.form, t = Y.tasks.find(x => x.id === F.id);

    }
    case 'pastOpen': L.past = { date: v || addD(TODAY, -1), kind: 'ex', id: S.ex[0]?.id, sets: [{ reps: 10, weight: 0 }, { reps: 10, weight: 0 }, { reps: 10, weight: 0 }] }; L.tab = 'gym'; L.gv = 'hist'; L.hist = 'days'; window.scrollTo(0, 0); break;
    case 'pastClose': L.past = null; break;
    case 'pastKind': L.past.date = document.getElementById('pDate').value || L.past.date; if (document.getElementById('pEx')) L.past.id = document.getElementById('pEx').value; L.past.kind = v; break;
    case 'ppAddSet': L.past.date = document.getElementById('pDate').value || L.past.date; L.past.id = document.getElementById('pEx').value; L.past.sets.push({ ...(L.past.sets[L.past.sets.length - 1] || { reps: 10, weight: 0 }) }); break;
    case 'ppDelSet': L.past.date = document.getElementById('pDate').value || L.past.date; L.past.id = document.getElementById('pEx').value; if (L.past.sets.length > 1) L.past.sets.splice(+b.dataset.i, 1); break;
    case 'pastSave': {

    case 'leOpen': L.logEdit = { date: v, id, sets: copy(logsByDate[v].items[id]) }; break;
    case 'leCancel': L.logEdit = null; break;
    case 'leAddSet': L.logEdit.sets.push({ ...(L.logEdit.sets[L.logEdit.sets.length - 1] || { reps: 10, weight: 0 }) }); break;
    case 'leDelSet': if (L.logEdit.sets.length > 1) L.logEdit.sets.splice(+b.dataset.i, 1); break;
    case 'leSave': {
      const E = L.logEdit, sets = copy(E.sets).filter(x => x.reps > 0);
      if (!sets.length) return toast('اكتب العدّات أول', true);
      logsByDate[E.date].items[E.id] = sets; S.logs = buildLogs();
      DB.saveLog(E.date, E.id, sets);
      // تعديل اليوم يحدّث بطاقة التمرين في «اليوم» بعد

      L.logEdit = null; toast('✓ انحفظ التعديل'); break;

    case 'leDel': {
      const E = L.logEdit;

    case 'open': { const s = session(); s.open = s.open === id ? '' : id; break; }
    case 'sched': {

    case 'editDay': { const d = dayById(id); L.tab = 'gym'; L.gv = 'ex'; L.edit = { ...d, ex: [...d.ex] }; window.scrollTo(0, 0); break; }
    case 'dcolor': L.edit.color = v; break;

    case 'dnewex': { const e = newExercise(); if (!e) return; L.edit.ex.push(e.id); saveProfile(); break; }
    case 'dcancel': L.edit = null; break;
    case 'dsave': {
      const D = L.edit, name = (D.name || '').trim();
      if (!name) return toast('اكتب اسم اليوم', true);
      const days = plan().days;
      if (D.id) days[days.findIndex(d => d.id === D.id)] = { ...D, name };
      else days.push({ id: 'd' + Date.now(), name, color: D.color, ex: D.ex });

      toast('✓ انحفظ ' + name);
      if (!D.id) { L.gv = 'sched'; window.scrollTo(0, 0); }
      break;
    }
    case 'ddel': {
      const D = L.edit;
      if (!confirm(`تحذف «${D.name}»؟ التمارين وسجلّها تبقى.`)) return;
      plan().days = plan().days.filter(d => d.id !== D.id);
      for (const k in plan().sched) if (plan().sched[k] === D.id) plan().sched[k] = 'off';
      L.edit = null; saveProfile(); break;

    case 'yes': it.step = 'inc'; it.inc = it.inc || { reps: 1, weight: 0 }; break;
    case 'no': it.target = copy(lastLog(id).sets); it.sets = copy(it.target); it.step = 'log'; break;
    case 'quick': {
      it.inc.reps = (+it.inc.reps || 0) + +b.dataset.r; it.inc.weight = (+it.inc.weight || 0) + +b.dataset.w;
      document.querySelector(`input[data-f="inc.reps"][data-id="${id}"]`).value = it.inc.reps;
      document.querySelector(`input[data-f="inc.weight"][data-id="${id}"]`).value = it.inc.weight;
      updPrev(id); saveLocal(); return;
    }
    case 'step': {
      const inp = b.parentElement.querySelector('input');
      if (b.dataset.f.startsWith('pp.')) {
        const nv = Math.max(0, Math.round(((+inp.value || 0) + +b.dataset.d) * 100) / 100);
        inp.value = nv; if (L.past) L.past.sets[+b.dataset.i][b.dataset.f.slice(3)] = nv; return;
      }
      if (b.dataset.f.startsWith('le.')) {

        inp.value = nv; if (L.logEdit) L.logEdit.sets[+b.dataset.i][b.dataset.f.slice(3)] = nv; return;
      }
      const nv = Math.max(0, Math.round(((+inp.value || 0) + +b.dataset.d) * 100) / 100);
      inp.value = nv; setField(it, b.dataset.f, b.dataset.i, nv);
      if (b.dataset.f.startsWith('inc.')) updPrev(id);
      saveLocal(); return;
    }
    case 'applyInc': it.target = incTarget(id, it); it.sets = copy(it.target); it.step = 'log'; break;
    case 'back': it.step = 'ask'; it.target = null; break;
    case 'mode': it.mode = v; exById(id).mode = v; saveProfile(); break;
    case 'addSet': it.sets.push({ ...(it.sets[it.sets.length - 1] || { reps: 10, weight: 0 }) }); break;
    case 'delSet': if (it.sets.length > 1) it.sets.splice(+b.dataset.i, 1); break;
    case 'saveEx': {
      const sets = copy(it.sets).filter(s => s.reps > 0);
      if (!sets.length) return toast('اكتب العدّات أول', true);
      const s = session(), d = dayById(s.part);
      const rec = logsByDate[TODAY] = logsByDate[TODAY] || { items: {} };
      rec.items = rec.items || {};
      rec.items[id] = sets;
      if (d) rec.day = { id: d.id, name: d.name, color: d.color };
      S.logs = buildLogs();
      DB.saveLog(TODAY, id, sets, rec.day); syncPush();
      it.sets = sets; it.step = 'done';
      const list = dayEx(d), idx = list.findIndex(e => e.id === id);
      const next = [...list.slice(idx + 1), ...list.slice(0, idx)].find(e => item(e.id).step !== 'done');
      s.open = next ? next.id : '';

      try { navigator.vibrate && navigator.vibrate(20); } catch (e) { }
      toast('✓ انحفظ ' + exById(id).name);
      render();
      if (!next && list.length) { confetti(); buzz([20, 60, 40]); }
      if (next) document.getElementById('ex-' + next.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    case 'edit': it.step = 'log'; break;
    case 'hist': L.hist = v; break;
    case 'chart': L.chart = v || null; L.tab = 'gym'; fx.page = true; window.scrollTo(0, 0); break;
    case 'restGo': startRest(+v); return;
    case 'repWk': L.repPrev = v === '1'; break;
    case 'restAdd': if (REST) { REST.end += 15000; REST.dur += 15; saveRest(); drawRest(); } return;
    case 'restStop': REST = null; saveRest(); drawRest(); return;
    case 'adding': L.adding = !L.adding; break;
    case 'nday': b.classList.toggle('on'); return;
    case 'delEx': {
      if (!confirm('تحذف «' + exById(id).name + '»؟ سجلّه القديم يبقى.')) return;
      S.ex = S.ex.filter(e => e.id !== id);
      for (const sys of ['ul', 'custom']) S.plans[sys].days.forEach(d => { d.ex = d.ex.filter(x => x !== id); });
      saveProfile(); break;
    }
    case 'renameEx': {
      const e = exById(id), nm = prompt('اسم التمرين', e.name);
      if (!nm || !nm.trim()) return;
      e.name = nm.trim();
      const m = prompt('العضلة', e.muscle);
      if (m !== null) e.muscle = m.trim();
      saveProfile(); break;
    }
    case 'addEx': {
      const nm = document.getElementById('nName').value.trim();
      if (!nm) return toast('اكتب اسم التمرين', true);
      const e = { id: 'e' + Date.now(), name: nm, muscle: document.getElementById('nMuscle').value.trim(), mode: 'one' };
      S.ex.push(e);
      document.querySelectorAll('#nDays .on').forEach(x => dayById(x.dataset.v)?.ex.push(e.id));
      L.adding = false; saveProfile(); toast('✓ انضاف ' + nm); break;
    }
    case 'export': return exportData();
    case 'logout': if (confirm('تسجّل خروج؟')) DB.logout(); return;
  }
  render();
});

document.addEventListener('input', ev => {
  const t = ev.target, f = t.dataset.f;
  if (!f) return;
  if (f === 'draft.name') { if (L.edit) L.edit.name = t.value; return; }
  if (f === 'set.gymTime') { if (t.value) { Y.set.gymTime = t.value; saveY(); } return; }
  if (f === 'set.weekTime') { if (t.value) { Y.set.weekTime = t.value; saveY(); } return; }
  if (f.startsWith('cfg.')) return;
  if (f === 'pp.reps' || f === 'pp.weight') { if (L.past) L.past.sets[+t.dataset.i][f.slice(3)] = t.value; return; }
  if (f === 'le.reps' || f === 'le.weight') { if (L.logEdit) L.logEdit.sets[+t.dataset.i][f.slice(3)] = t.value; return; }
  if (!L.sess) return;
  setField(L.sess.items[t.dataset.id], f, t.dataset.i, t.value);
  if (f.startsWith('inc.')) updPrev(t.dataset.id);
  saveLocal();
});

// الأرقام تُكتب بأي شكل: «٢٫٥، ٥» أو «2.5, 5»، و«1:30» أو «90»
const toLatin = v => String(v).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫]/g, '.');
const nums = v => toLatin(v).split(/[،,\s]+/).map(x => x.trim()).filter(Boolean);
document.addEventListener('change', ev => {
  const t = ev.target, f = t.dataset && t.dataset.f;
  if (!f || !f.startsWith('cfg.') || !Y) return;
  const k = f.slice(4);
  if (k === 'wsteps') { const a = nums(t.value).map(Number).filter(x => x > 0); if (!a.length) return toast('اكتب رقم واحد على الأقل', true); Y.set.wsteps = [...new Set(a)].slice(0, 6); }
  else if (k === 'wstep') { const x = +toLatin(t.value); if (!(x > 0)) return toast('اكتب رقم أكبر من صفر', true); Y.set.wstep = x; }
  else if (k === 'rests') {
    const a = nums(t.value).map(x => x.includes(':') ? (+x.split(':')[0]) * 60 + (+x.split(':')[1] || 0) : +x * (+x < 10 ? 60 : 1)).filter(x => x >= 5 && x <= 1800);
    if (!a.length) return toast('اكتب مدة وحدة على الأقل، مثل 1:30', true); Y.set.rests = [...new Set(a)].slice(0, 6);
  }
  else if (k === 'name') Y.set.name = String(t.value).trim().slice(0, 30);
  else if (k === 'acts') { const a = String(t.value).split(/[،,]+/).map(x => x.trim()).filter(Boolean); if (!a.length) return toast('اكتب نشاط واحد على الأقل', true); Y.set.acts = [...new Set(a)].slice(0, 12); }
  else return;
  saveY(); toast('✓ انحفظ'); render();
});

initDB().then(() => DB.onAuth(u => {
  unsubs.forEach(f => f()); unsubs = [];
  USER = u; S = null; Y = null; logsByDate = {}; IMG = {}; choosing = false; L.edit = null; L.form = null;
  if (!u) return renderLogin();
  if (L.uid !== u.uid) { L.sess = null; L.uid = u.uid; }
  renderLoading();
  listen(u.uid);
})).catch(e => { console.error(e); renderLogin('ما قدرت أحمّل: ' + e.message); });
</script>
